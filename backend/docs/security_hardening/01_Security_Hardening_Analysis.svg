<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Security Hardening :- Full Analysis</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-family="Excalifont, 'Comic Sans MS', cursive" font-size="14" fill="#6c7086" text-anchor="middle">What we already have  +  what is missing</text>

  <!-- LEFT — Already implemented -->
  <rect x="50" y="88" width="530" height="474" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <text x="315" y="113" font-size="17" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Already in Implementation :-</text>
  <line x1="70" y1="122" x2="570" y2="122" stroke="#a6e3a1" stroke-width="0.8"/>

  <!-- Items already implemented -->
  <rect x="70" y="136" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="160" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  JWT Authentication</text>
  <text x="110" y="179" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Bearer token validation on every protected route</text>

  <rect x="70" y="198" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="222" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Scoped Queries  ( Data Isolation )</text>
  <text x="110" y="241" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">All queries filtered by user_id — users cannot access each other's data</text>

  <rect x="70" y="260" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="284" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  FormRequest Validation</text>
  <text x="110" y="303" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Input validated before reaching controller — bad data rejected early</text>

  <rect x="70" y="322" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="346" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  cascadeOnDelete</text>
  <text x="110" y="365" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Related records removed automatically when parent is deleted — no orphaned data</text>

  <rect x="70" y="384" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="408" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Password Hashing  ( hashed cast )</text>
  <text x="110" y="427" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Passwords never stored in plain text — bcrypt via Eloquent cast</text>

  <rect x="70" y="446" width="490" height="52" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="110" y="470" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  ML Graceful Degradation</text>
  <text x="110" y="489" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">App continues working if ML is down — returns fallback instead of crashing</text>

  <text x="315" y="544" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">6 security mechanisms active in current implementation</text>

  <!-- RIGHT — Missing / Security Hardening -->
  <rect x="620" y="88" width="530" height="474" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.4"/>
  <text x="885" y="113" font-size="17" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  Missing — Security Hardening :-</text>
  <line x1="640" y1="122" x2="1140" y2="122" stroke="#f9e2af" stroke-width="0.8"/>

  <!-- Missing items -->
  <rect x="640" y="136" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="160" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  ApiResponse Helper</text>
  <text x="680" y="179" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Consistent JSON response structure across all endpoints</text>

  <rect x="640" y="198" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="222" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  Global Exception Handler</text>
  <text x="680" y="241" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">All errors return clean JSON — no raw stack traces exposed to client</text>

  <rect x="640" y="260" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="284" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  Rate Limiting  ( 3 levels )</text>
  <text x="680" y="303" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Throttle login, register, public routes, and protected routes separately</text>

  <rect x="640" y="322" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="346" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  CORS Configuration</text>
  <text x="680" y="365" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Only allowed origins can call the API — prevent unauthorized cross-origin requests</text>

  <rect x="640" y="384" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="408" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  N+1 Review on Services</text>
  <text x="680" y="427" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Audit queries in HomeService and others to prevent N+1 query problems</text>

  <rect x="640" y="446" width="490" height="52" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="680" y="470" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">⚠  ML Parallel Calls  +  ML Caching</text>
  <text x="680" y="489" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Http::pool() + Cache::remember() — already analysed in performance section</text>

  <text x="885" y="544" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">7 hardening items to implement in this phase</text>

  <!-- Footer -->
  <line x1="50" y1="578" x2="1150" y2="578" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="594" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Security Hardening Feature  —  Analysis</text>
</svg>
