<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="600" y="46" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Business Rules :- Favorites</text>
  <line x1="60" y1="56" x2="1140" y2="56" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Rule 1 -->
  <rect x="50" y="72" width="1100" height="68" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="106" r="14" fill="#f38ba8" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="111" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">1</text>
  <text x="108" y="100" font-size="16" fill="#f38ba8" font-family="Excalifont, cursive">Must be logged in</text>
  <text x="108" y="122" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">Favorites require authentication — protected route via auth:api middleware</text>
  <line x1="55" y1="140" x2="1145" y2="140" stroke="#313244" stroke-width="0.6"/>

  <!-- Rule 2 -->
  <rect x="50" y="148" width="1100" height="76" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="186" r="14" fill="#f9e2af" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="191" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">2</text>
  <text x="108" y="180" font-size="16" fill="#f9e2af" font-family="Excalifont, cursive">No duplicate titles</text>
  <text x="108" y="202" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">Cannot add the same title twice  →  UNIQUE(user_id, title_name) constraint in DB</text>
  <text x="108" y="218" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">Returns 422 if duplicate detected</text>
  <line x1="55" y1="224" x2="1145" y2="224" stroke="#313244" stroke-width="0.6"/>

  <!-- Rule 3 -->
  <rect x="50" y="232" width="1100" height="76" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="270" r="14" fill="#94e2d5" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="275" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">3</text>
  <text x="108" y="264" font-size="16" fill="#94e2d5" font-family="Excalifont, cursive">Genres snapshot from ML</text>
  <text x="108" y="286" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">When adding a Favorite → Backend calls ML: getTitleDetail("Breaking Bad")</text>
  <text x="108" y="302" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">Stores genres at time of addition — no ML call needed on every read</text>
  <line x1="55" y1="308" x2="1145" y2="308" stroke="#313244" stroke-width="0.6"/>

  <!-- Rule 4 -->
  <rect x="50" y="316" width="1100" height="68" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="350" r="14" fill="#a6e3a1" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="355" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">4</text>
  <text x="108" y="344" font-size="16" fill="#a6e3a1" font-family="Excalifont, cursive">Genres travel with the Favorite</text>
  <text x="108" y="366" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">genres field is stored in DB — passed along whenever needed (e.g. Home Personalization)</text>
  <line x1="55" y1="384" x2="1145" y2="384" stroke="#313244" stroke-width="0.6"/>

  <!-- Rule 5 -->
  <rect x="50" y="392" width="1100" height="68" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="426" r="14" fill="#fab387" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="431" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">5</text>
  <text x="108" y="420" font-size="16" fill="#fab387" font-family="Excalifont, cursive">Sorted newest first</text>
  <text x="108" y="442" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">Favorites list ordered by added_at DESC — most recently added appears first</text>
  <line x1="55" y1="460" x2="1145" y2="460" stroke="#313244" stroke-width="0.6"/>

  <!-- Rule 6 -->
  <rect x="50" y="468" width="1100" height="68" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="502" r="14" fill="#cba6f7" stroke="#cdd6f4" stroke-width="1.3"/>
  <text x="82" y="507" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">6</text>
  <text x="108" y="496" font-size="16" fill="#cba6f7" font-family="Excalifont, cursive">Data Isolation</text>
  <text x="108" y="518" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">User sees only their own Favorites — all queries scoped by user_id</text>

  <!-- footer -->
  <line x1="50" y1="546" x2="1150" y2="546" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="558" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">Favorites Feature  —  Business Rules</text>
</svg>
