<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Implementation Tree :- Favorites Feature</text>
  <line x1="60" y1="54" x2="1140" y2="54" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">Build order — each phase depends on the previous</text>

  <!-- Phase 1: StoreFavoriteRequest -->
  <rect x="50" y="88" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="116" r="14" fill="#f38ba8" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="121" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">1</text>
  <text x="108" y="114" font-size="17" fill="#f38ba8" font-family="Excalifont, cursive">StoreFavoriteRequest</text>
  <text x="480" y="114" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">app/Http/Requests/StoreFavoriteRequest.php</text>
  <line x1="82" y1="130" x2="82" y2="158" stroke="#f38ba8" stroke-width="0.6"/>
  <line x1="82" y1="144" x2="102" y2="144" stroke="#f38ba8" stroke-width="0.6"/>
  <text x="110" y="149" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">title_name:  required,  string</text>

  <!-- Phase 2: FavoriteService -->
  <rect x="50" y="178" width="1100" height="118" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="206" r="14" fill="#94e2d5" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="211" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">2</text>
  <text x="108" y="204" font-size="17" fill="#94e2d5" font-family="Excalifont, cursive">FavoriteService</text>
  <text x="400" y="204" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">app/Services/FavoriteService.php</text>

  <line x1="82" y1="220" x2="82" y2="288" stroke="#94e2d5" stroke-width="0.6"/>
  <line x1="82" y1="234" x2="102" y2="234" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="239" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">getFavorites(User)</text>
  <text x="520" y="239" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  list — ordered by added_at DESC</text>

  <line x1="82" y1="252" x2="102" y2="252" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="257" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">addFavorite(User, data)</text>
  <text x="520" y="257" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  create + call ML for genres snapshot</text>

  <line x1="82" y1="270" x2="102" y2="270" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="275" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">removeFavorite(User, title_name)</text>
  <text x="520" y="275" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  delete scoped to user</text>

  <!-- Phase 3: FavoriteResource -->
  <rect x="50" y="308" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="336" r="14" fill="#cba6f7" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="341" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">3</text>
  <text x="108" y="334" font-size="17" fill="#cba6f7" font-family="Excalifont, cursive">FavoriteResource</text>
  <text x="420" y="334" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">app/Http/Resources/FavoriteResource.php</text>
  <line x1="82" y1="350" x2="82" y2="378" stroke="#cba6f7" stroke-width="0.6"/>
  <line x1="82" y1="364" x2="102" y2="364" stroke="#cba6f7" stroke-width="0.6"/>
  <text x="110" y="369" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">Formats response — id, title_name, title_type, genres, release_year, added_at</text>

  <!-- Phase 4: FavoriteController -->
  <rect x="50" y="398" width="1100" height="118" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="426" r="14" fill="#a6e3a1" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="431" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">4</text>
  <text x="108" y="424" font-size="17" fill="#a6e3a1" font-family="Excalifont, cursive">FavoriteController</text>
  <text x="400" y="424" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">app/Http/Controllers/Api/FavoriteController.php</text>

  <line x1="82" y1="440" x2="82" y2="508" stroke="#a6e3a1" stroke-width="0.6"/>
  <line x1="82" y1="454" x2="102" y2="454" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="459" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">index()</text>
  <text x="300" y="459" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  GET  /api/favorites</text>

  <line x1="82" y1="472" x2="102" y2="472" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="477" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">store()</text>
  <text x="300" y="477" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  POST  /api/favorites</text>

  <line x1="82" y1="490" x2="102" y2="490" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="495" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">destroy()</text>
  <text x="300" y="495" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  DELETE  /api/favorites/{title_name}</text>

  <!-- Phase 5: Routes -->
  <rect x="50" y="528" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="556" r="14" fill="#f9e2af" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="561" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">5</text>
  <text x="108" y="554" font-size="17" fill="#f9e2af" font-family="Excalifont, cursive">Routes</text>
  <text x="280" y="554" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">routes/api.php</text>
  <line x1="82" y1="570" x2="82" y2="598" stroke="#f9e2af" stroke-width="0.6"/>
  <line x1="82" y1="584" x2="102" y2="584" stroke="#f9e2af" stroke-width="0.6"/>
  <text x="110" y="589" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">Protected  →  middleware: auth:api</text>

  <!-- Phase 6: Tests -->
  <rect x="50" y="618" width="1100" height="118" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="646" r="14" fill="#fab387" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="651" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">6</text>
  <text x="108" y="644" font-size="17" fill="#fab387" font-family="Excalifont, cursive">Tests</text>
  <text x="260" y="644" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">tests/Feature/Api/FavoriteTest.php</text>

  <line x1="82" y1="660" x2="82" y2="728" stroke="#fab387" stroke-width="0.6"/>
  <line x1="82" y1="674" x2="102" y2="674" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="679" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">Happy Path  —  add and list favorites</text>

  <line x1="82" y1="692" x2="102" y2="692" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="697" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">Duplicate Prevention  —  422 on second add</text>

  <line x1="82" y1="710" x2="102" y2="710" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="715" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">Data Isolation  —  user sees only their own</text>

  <line x1="82" y1="728" x2="102" y2="728" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="733" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">ML Unavailable Handling  —  503 response</text>

  <!-- footer -->
  <line x1="50" y1="756" x2="1150" y2="756" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="770" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">Favorites Feature  —  Implementation Tree</text>
</svg>
