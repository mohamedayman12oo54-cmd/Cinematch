<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Genres Snapshot :- Key Design Decision</text>
  <line x1="60" y1="54" x2="1140" y2="54" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">When a User adds a Favorite — what happens behind the scenes</text>

  <!-- Step 1 -->
  <rect x="50" y="88" width="1100" height="100" rx="6" fill="#11111b" stroke="#94e2d5" stroke-width="1.2"/>
  <circle cx="82" cy="116" r="14" fill="#94e2d5" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="121" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">1</text>
  <text x="108" y="114" font-size="16" fill="#94e2d5" font-family="Excalifont, cursive">Backend calls ML for title details</text>
  <text x="108" y="138" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">getTitleDetail("Breaking Bad")</text>
  <text x="108" y="160" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→   {  genres: "Crime, Drama, Thriller",   type: "TV Show",   release_year: 2008,  ...  }</text>

  <!-- Arrow down -->
  <line x1="600" y1="188" x2="600" y2="214" stroke="#cdd6f4" stroke-width="1.4"/>
  <polygon points="600,218 594,206 606,206" fill="#cdd6f4"/>

  <!-- Step 2 -->
  <rect x="50" y="218" width="1100" height="100" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <circle cx="82" cy="246" r="14" fill="#a6e3a1" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="251" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, cursive">2</text>
  <text x="108" y="244" font-size="16" fill="#a6e3a1" font-family="Excalifont, cursive">Backend stores Favorite with genres snapshot</text>
  <text x="108" y="268" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">INSERT INTO favorites (user_id, title_name, genres, title_type, release_year, added_at)</text>
  <text x="108" y="290" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">genres are frozen at the moment of adding — not re-fetched from ML on every read</text>

  <!-- Why section -->
  <rect x="50" y="334" width="520" height="220" rx="6" fill="#181825" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="310" y="358" font-size="16" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, cursive">Why this matters :-</text>
  <line x1="70" y1="366" x2="550" y2="366" stroke="#f9e2af" stroke-width="0.7"/>
  <text x="75" y="390" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">→  Home Personalization uses genres</text>
  <text x="75" y="412" font-size="13" fill="#cdd6f4" font-family="Excalifont, cursive">→  Favorites need to carry genres along</text>
  <text x="75" y="434" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  No ML call needed on every page load</text>
  <text x="75" y="456" font-size="13" fill="#6c7086" font-family="Excalifont, cursive">→  Genres stay consistent even if ML updates</text>
  <text x="75" y="490" font-size="13" fill="#94e2d5" font-family="Excalifont, cursive">Same concept as Brewtica's price snapshot:</text>
  <text x="75" y="512" font-size="12" fill="#6c7086" font-family="Excalifont, cursive">order_details.price  =  price at time of purchase</text>
  <text x="75" y="532" font-size="12" fill="#6c7086" font-family="Excalifont, cursive">favorites.genres     =  genres at time of adding</text>

  <!-- Read flow -->
  <rect x="610" y="334" width="540" height="220" rx="6" fill="#181825" stroke="#cba6f7" stroke-width="1.2"/>
  <text x="880" y="358" font-size="16" fill="#cba6f7" text-anchor="middle" font-family="Excalifont, cursive">Read Flow  (no ML call) :-</text>
  <line x1="630" y1="366" x2="1130" y2="366" stroke="#cba6f7" stroke-width="0.7"/>

  <!-- mini flow -->
  <rect x="630" y="380" width="120" height="44" rx="4" fill="#181825" stroke="#cdd6f4" stroke-width="1.1"/>
  <text x="690" y="398" font-size="12" fill="#94e2d5" text-anchor="middle" font-family="Excalifont, cursive">Frontend</text>
  <text x="690" y="414" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">GET /favorites</text>

  <line x1="750" y1="402" x2="790" y2="402" stroke="#cdd6f4" stroke-width="1.3"/>
  <polygon points="793,402 783,397 783,407" fill="#cdd6f4"/>

  <rect x="794" y="380" width="120" height="44" rx="4" fill="#181825" stroke="#cdd6f4" stroke-width="1.1"/>
  <text x="854" y="398" font-size="12" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, cursive">Backend</text>
  <text x="854" y="414" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">DB query only</text>

  <line x1="914" y1="402" x2="954" y2="402" stroke="#cdd6f4" stroke-width="1.3"/>
  <polygon points="957,402 947,397 947,407" fill="#cdd6f4"/>

  <rect x="958" y="380" width="120" height="44" rx="4" fill="#181825" stroke="#cdd6f4" stroke-width="1.1"/>
  <text x="1018" y="398" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, cursive">DB</text>
  <text x="1018" y="414" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">favorites table</text>

  <text x="880" y="448" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">genres already stored — no ML needed</text>

  <text x="880" y="486" font-size="13" fill="#fab387" text-anchor="middle" font-family="Excalifont, cursive">Write Flow  (ML called once) :-</text>
  <text x="880" y="510" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">POST /favorites  →  ML call  →  store snapshot  →  done</text>
  <text x="880" y="530" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">All future reads use the stored snapshot</text>

  <!-- footer -->
  <line x1="50" y1="636" x2="1150" y2="636" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="650" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, cursive">Favorites Feature  —  Genres Snapshot Design</text>
</svg>
