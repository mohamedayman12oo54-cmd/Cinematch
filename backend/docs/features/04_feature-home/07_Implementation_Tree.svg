<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Implementation Tree :- Home Feature</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Build order — each phase depends on the previous</text>

  <!-- Phase 1: HomeService -->
  <rect x="50" y="88" width="1100" height="388" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="116" r="14" fill="#94e2d5"/><text x="82" y="121" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">1</text>
  <text x="108" y="114" font-size="17" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">HomeService</text>
  <text x="340" y="114" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Services/HomeService.php  —  core personalization engine</text>

  <line x1="82" y1="130" x2="82" y2="468" stroke="#94e2d5" stroke-width="0.6"/>

  <line x1="82" y1="144" x2="102" y2="144" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="149" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">getHome(User|null)</text>
  <text x="480" y="149" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  entry point — determines stage then delegates</text>

  <line x1="82" y1="168" x2="102" y2="168" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="173" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">buildStrangerHome()</text>
  <text x="480" y="173" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  popular only  ( Guest + Stranger )</text>

  <line x1="82" y1="192" x2="102" y2="192" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="197" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">buildExplorerHome(User)</text>
  <text x="480" y="197" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  1 Favorite seed + popular</text>

  <line x1="82" y1="216" x2="102" y2="216" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="221" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">buildRegularHome(User)</text>
  <text x="480" y="221" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  3 seeds + because_you_watched + continue exploring</text>

  <line x1="82" y1="240" x2="102" y2="240" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="245" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">buildLoyalHome(User)</text>
  <text x="480" y="245" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  5 seeds weighted + because_you_loved + new_for_you</text>

  <line x1="82" y1="264" x2="102" y2="264" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="269" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">getPersonalizedSection(seeds, watched, favorites)</text>
  <text x="660" y="269" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  calls ML per seed + merges results</text>

  <line x1="82" y1="288" x2="102" y2="288" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="293" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">getBecauseYouWatchedSection(User, watched, favorites)</text>
  <text x="660" y="293" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  last watched as seed</text>

  <line x1="82" y1="312" x2="102" y2="312" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="317" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">mergeAndRankResults(results)</text>
  <text x="480" y="317" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  deduplicate + rank by count + score</text>

  <line x1="82" y1="336" x2="102" y2="336" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="341" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">filterSeenTitles(results, watched, favorites)</text>
  <text x="620" y="341" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  remove already-seen titles</text>

  <!-- Phase 2 -->
  <rect x="50" y="490" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="518" r="14" fill="#cba6f7"/><text x="82" y="523" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">2</text>
  <text x="108" y="516" font-size="17" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">HomeController</text>
  <text x="380" y="516" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Http/Controllers/Api/HomeController.php</text>
  <line x1="82" y1="532" x2="82" y2="560" stroke="#cba6f7" stroke-width="0.6"/>
  <line x1="82" y1="546" x2="102" y2="546" stroke="#cba6f7" stroke-width="0.6"/>
  <text x="110" y="551" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">__invoke()    →    GET /api/home</text>
  <text x="480" y="551" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">single action controller — delegates to HomeService</text>

  <!-- Phase 3 -->
  <rect x="50" y="580" width="1100" height="66" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="613" r="14" fill="#f9e2af"/><text x="82" y="618" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">3</text>
  <text x="108" y="611" font-size="17" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Routes  →  Public</text>
  <text x="380" y="611" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">routes/api.php  —  no auth middleware  (public endpoint)</text>
  <line x1="82" y1="627" x2="82" y2="638" stroke="#f9e2af" stroke-width="0.6"/>
  <line x1="82" y1="632" x2="102" y2="632" stroke="#f9e2af" stroke-width="0.6"/>
  <text x="110" y="637" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Auth detected via optional middleware  →  JWT present = personalized,  absent = popular only</text>

  <!-- Phase 4 -->
  <rect x="50" y="658" width="1100" height="118" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="686" r="14" fill="#fab387"/><text x="82" y="691" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">4</text>
  <text x="108" y="684" font-size="17" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">Tests</text>
  <text x="260" y="684" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">tests/Feature/Api/HomeTest.php</text>
  <line x1="82" y1="700" x2="82" y2="768" stroke="#fab387" stroke-width="0.6"/>
  <line x1="82" y1="710" x2="102" y2="710" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="715" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">GuestTest       —  popular sections only</text>
  <line x1="82" y1="726" x2="102" y2="726" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="731" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">StrangerTest    —  signalCount = 0  →  popular</text>
  <line x1="82" y1="742" x2="102" y2="742" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="747" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">ExplorerTest    —  mixed: personalized + popular</text>
  <line x1="82" y1="758" x2="102" y2="758" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="763" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">RegularTest     —  3-section personalization</text>
  <line x1="82" y1="768" x2="102" y2="768" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="773" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">FilteringTest   —  seen titles removed from results</text>

  <line x1="50" y1="796" x2="1150" y2="796" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="810" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Implementation Tree</text>
</svg>
