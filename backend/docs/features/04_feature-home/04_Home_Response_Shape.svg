<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Response Shape :- GET /api/home</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">stage field drives the Frontend layout  —  sections array drives the content rows</text>

  <!-- Left: Regular response -->
  <rect x="50" y="88" width="530" height="560" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.3"/>
  <text x="315" y="110" font-size="15" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Regular User Response (200) :-</text>
  <line x1="70" y1="118" x2="570" y2="118" stroke="#fab387" stroke-width="0.7"/>
  <text x="70" y="142" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="70" y="162" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">  "status": "success",</text>
  <text x="70" y="182" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  "data": {</text>
  <text x="70" y="202" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">    "stage": "regular",</text>
  <text x="70" y="222" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    "sections": [</text>

  <text x="70" y="248" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      {</text>
  <text x="70" y="266" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">        "type":  "personalized",</text>
  <text x="70" y="284" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Handpicked For You",</text>
  <text x="70" y="302" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...]</text>
  <text x="70" y="320" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      },</text>

  <text x="70" y="344" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      {</text>
  <text x="70" y="362" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">        "type":       "because_you_watched",</text>
  <text x="70" y="380" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">        "title":      "Because You Watched Mindhunter",</text>
  <text x="70" y="398" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">        "seed_title": "Mindhunter",</text>
  <text x="70" y="416" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...]</text>
  <text x="70" y="434" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      },</text>

  <text x="70" y="458" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      {</text>
  <text x="70" y="476" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "type":  "popular",</text>
  <text x="70" y="494" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Popular on Netflix",</text>
  <text x="70" y="512" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...]</text>
  <text x="70" y="530" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      }</text>

  <text x="70" y="552" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    ]</text>
  <text x="70" y="572" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  }</text>
  <text x="70" y="592" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Right: Stranger response -->
  <rect x="620" y="88" width="530" height="300" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="885" y="110" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Guest / Stranger Response (200) :-</text>
  <line x1="640" y1="118" x2="1140" y2="118" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="640" y="142" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="640" y="162" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">  "status": "success",</text>
  <text x="640" y="182" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  "data": {</text>
  <text x="640" y="202" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">    "stage": "stranger",</text>
  <text x="640" y="222" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    "sections": [</text>
  <text x="640" y="244" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      {</text>
  <text x="640" y="262" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "type":  "popular",</text>
  <text x="640" y="280" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Popular on Netflix",</text>
  <text x="640" y="298" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [ { similarity_score: null } ]</text>
  <text x="640" y="316" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      }</text>
  <text x="640" y="336" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    ]</text>
  <text x="640" y="356" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  }</text>
  <text x="640" y="376" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- section types legend -->
  <rect x="620" y="404" width="530" height="230" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="885" y="426" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Section types :-</text>
  <line x1="640" y1="434" x2="1140" y2="434" stroke="#313244" stroke-width="0.7"/>
  <text x="648" y="458" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">personalized</text>
  <text x="820" y="458" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Handpicked For You  ( merged seeds )</text>
  <text x="648" y="484" font-size="13" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">because_you_watched</text>
  <text x="820" y="484" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Based on last watched title</text>
  <text x="648" y="510" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">popular</text>
  <text x="820" y="510" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Popular titles from ML</text>
  <text x="648" y="536" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">new_for_you</text>
  <text x="820" y="536" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Fresh titles matching taste  ( Loyal only )</text>
  <text x="648" y="562" font-size="13" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">hidden_gems  ★</text>
  <text x="820" y="562" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Future feature</text>
  <text x="648" y="588" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">seed_title field present only in because_you_watched type</text>
  <text x="648" y="606" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">similarity_score is null for popular results</text>

  <line x1="50" y1="696" x2="1150" y2="696" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="710" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Response Shape</text>
</svg>
