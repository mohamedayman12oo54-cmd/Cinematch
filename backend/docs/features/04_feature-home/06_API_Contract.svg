<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860">
  <rect width="1300" height="860" fill="#1e1e2e"/>
  <text x="650" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contract :- GET /api/home</text>
  <line x1="60" y1="55" x2="1240" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Badge + meta -->
  <rect x="60" y="68" width="70" height="28" rx="4" fill="#89b4fa"/>
  <text x="95" y="87" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET</text>
  <text x="145" y="87" font-size="15" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">/api/home</text>
  <text x="60" y="112" font-size="14" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="60" y="132" font-size="14" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">If authenticated  →  personalized response based on user stage</text>

  <!-- Left: Guest response -->
  <rect x="50" y="150" width="580" height="400" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="340" y="173" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Response for Guest / Stranger (200) :-</text>
  <line x1="70" y1="181" x2="620" y2="181" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="70" y="205" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="70" y="225" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">  "status": "success",</text>
  <text x="70" y="245" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  "data": {</text>
  <text x="70" y="265" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">    "stage": "stranger",</text>
  <text x="70" y="285" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    "sections": [</text>
  <text x="70" y="305" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      {</text>
  <text x="70" y="325" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "type":  "popular",</text>
  <text x="70" y="345" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Popular on Netflix",</text>
  <text x="70" y="365" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [</text>
  <text x="70" y="385" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">          {</text>
  <text x="70" y="405" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">            "title": "Breaking Bad",</text>
  <text x="70" y="421" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">            "type":  "TV Show",</text>
  <text x="70" y="437" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">            "release_year": 2008,</text>
  <text x="70" y="453" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">            "similarity_score": null</text>
  <text x="70" y="469" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">          }</text>
  <text x="70" y="485" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">        ]</text>
  <text x="70" y="501" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">      }</text>
  <text x="70" y="517" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    ]</text>
  <text x="70" y="533" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  }</text>
  <text x="70" y="545" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Right: Regular response -->
  <rect x="670" y="150" width="580" height="400" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.3"/>
  <text x="960" y="173" font-size="15" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Response for Regular User (200) :-</text>
  <line x1="690" y1="181" x2="1240" y2="181" stroke="#fab387" stroke-width="0.7"/>
  <text x="690" y="205" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="690" y="225" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">  "status": "success",</text>
  <text x="690" y="245" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  "data": {</text>
  <text x="690" y="265" font-size="12" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">    "stage": "regular",</text>
  <text x="690" y="285" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    "sections": [</text>
  <text x="690" y="305" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">      { "type": "personalized",</text>
  <text x="690" y="323" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Handpicked For You",</text>
  <text x="690" y="341" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...] },</text>
  <text x="690" y="365" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">      { "type": "because_you_watched",</text>
  <text x="690" y="383" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Because You Watched Mindhunter",</text>
  <text x="690" y="401" font-size="12" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">        "seed_title": "Mindhunter",</text>
  <text x="690" y="419" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...] },</text>
  <text x="690" y="443" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">      { "type": "popular",</text>
  <text x="690" y="461" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "title": "Popular on Netflix",</text>
  <text x="690" y="479" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        "items": [...] }</text>
  <text x="690" y="501" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    ]</text>
  <text x="690" y="519" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">  }</text>
  <text x="690" y="537" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Key notes -->
  <rect x="50" y="568" width="1200" height="70" rx="6" fill="#181825" stroke="#313244" stroke-width="1.0"/>
  <text x="650" y="592" font-size="14" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Key notes :-</text>
  <text x="650" y="614" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">stage field in response tells Frontend which layout to render  |  similarity_score is null for popular results  |  seed_title only in because_you_watched sections</text>

  <!-- Stage summary bar -->
  <rect x="50" y="654" width="270" height="46" rx="4" fill="#11111b" stroke="#a6e3a1" stroke-width="1.0"/>
  <text x="185" y="673" font-size="13" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Stranger  →  1 section</text>
  <text x="185" y="691" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">popular only</text>

  <rect x="360" y="654" width="270" height="46" rx="4" fill="#11111b" stroke="#89b4fa" stroke-width="1.0"/>
  <text x="495" y="673" font-size="13" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Explorer  →  2 sections</text>
  <text x="495" y="691" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">favorites-based + popular</text>

  <rect x="680" y="654" width="270" height="46" rx="4" fill="#11111b" stroke="#fab387" stroke-width="1.0"/>
  <text x="815" y="673" font-size="13" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Regular  →  3 sections</text>
  <text x="815" y="691" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">personalized + watched + popular</text>

  <rect x="1000" y="654" width="270" height="46" rx="4" fill="#11111b" stroke="#f38ba8" stroke-width="1.0"/>
  <text x="1135" y="673" font-size="13" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Loyal  →  4+ sections</text>
  <text x="1135" y="691" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">full personalization</text>

  <line x1="50" y1="836" x2="1250" y2="836" stroke="#313244" stroke-width="0.7"/>
  <text x="650" y="850" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  API Contract</text>
</svg>
