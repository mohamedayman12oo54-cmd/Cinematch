<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <rect width="1200" height="740" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Page :- 4 User Stages</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Stage is determined at runtime based on signalCount  ( favorites + watched_titles )</text>

  <!-- Stage 1 -->
  <rect x="50" y="88" width="1100" height="278" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <circle cx="90" cy="112" r="10" fill="#a6e3a1"/>
  <text x="108" y="116" font-size="19" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Stage 1  —  Stranger    ( signalCount = 0 )</text>

  <text x="80" y="148" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">User :-</text>
  <text x="80" y="170" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Not logged in  —  OR  —  logged in but no Favorites or Watched titles yet</text>

  <text x="80" y="200" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Home shows :-</text>
  <line x1="100" y1="216" x2="100" y2="228" stroke="#a6e3a1" stroke-width="0.7"/>
  <line x1="100" y1="222" x2="120" y2="222" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="128" y="227" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Popular Titles from ML</text>
  <text x="310" y="227" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→   "Most watched on Netflix"</text>

  <text x="80" y="258" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Why :-</text>
  <text x="80" y="280" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">System has no data about this user  →  Cold Start Problem</text>
  <text x="80" y="300" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">Solution:  show what many people enjoy  —  safe starting point</text>
  <text x="80" y="322" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Guest and Stranger see identical home page</text>
  <text x="80" y="344" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">similarity_score is null for popular results ( no personalization )</text>

  <!-- Stage 2 -->
  <rect x="50" y="380" width="1100" height="310" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1.4"/>
  <circle cx="90" cy="404" r="10" fill="#89b4fa"/>
  <text x="108" y="408" font-size="19" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">Stage 2  —  Explorer    ( signalCount 1–4 )</text>

  <text x="80" y="440" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">User :-</text>
  <text x="80" y="462" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Early stage  —  has some signals but not enough for full personalization</text>

  <text x="80" y="492" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Home shows :-</text>
  <line x1="100" y1="508" x2="100" y2="544" stroke="#89b4fa" stroke-width="0.7"/>
  <line x1="100" y1="514" x2="120" y2="514" stroke="#89b4fa" stroke-width="0.7"/>
  <text x="128" y="519" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Based on Your Favorites  ( if exists )</text>
  <text x="420" y="519" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→   ML recommendations using first Favorite as seed  →  top results</text>
  <line x1="100" y1="538" x2="120" y2="538" stroke="#89b4fa" stroke-width="0.7"/>
  <text x="128" y="543" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Popular Titles  ( rest of page )</text>
  <text x="380" y="543" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→   fills remaining sections</text>

  <text x="80" y="574" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Why :-</text>
  <text x="80" y="596" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">1–4 signals is not enough for full personalization</text>
  <text x="80" y="618" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">System starts learning taste  —  mixed popular + personalization approach</text>
  <text x="80" y="640" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">stage field returned in response so Frontend knows which layout to render</text>
  <text x="80" y="662" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">User's stage field is updated to "explorer"</text>

  <line x1="50" y1="718" x2="1150" y2="718" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="732" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Stages 1 &amp; 2</text>
</svg>
