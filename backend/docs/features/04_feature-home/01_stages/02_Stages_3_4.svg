<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Page :- Stages 3 &amp; 4</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Stage 3 -->
  <rect x="50" y="72" width="1100" height="352" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.4"/>
  <circle cx="90" cy="97" r="10" fill="#fab387"/>
  <text x="108" y="101" font-size="19" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">Stage 3  —  Regular    ( signalCount 5–19 )</text>

  <text x="80" y="134" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">User :-</text>
  <text x="80" y="155" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">System has enough history to understand their taste</text>

  <text x="80" y="185" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Home sections :-</text>
  <line x1="100" y1="200" x2="100" y2="294" stroke="#fab387" stroke-width="0.7"/>

  <line x1="100" y1="208" x2="120" y2="208" stroke="#fab387" stroke-width="0.7"/>
  <text x="128" y="213" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Handpicked For You</text>
  <text x="80" y="232" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  ML recommendations using last 3 Favorites as seeds</text>
  <text x="80" y="250" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  results merged, deduplicated, user-seen titles filtered out</text>

  <line x1="100" y1="266" x2="120" y2="266" stroke="#fab387" stroke-width="0.7"/>
  <text x="128" y="271" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Because You Watched  {last_watched}</text>
  <text x="80" y="290" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  recommendations based on most recent watched title</text>

  <line x1="100" y1="306" x2="120" y2="306" stroke="#fab387" stroke-width="0.7"/>
  <text x="128" y="311" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Continue Exploring</text>
  <text x="80" y="330" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  fresh mix from different genres not yet seen</text>

  <text x="80" y="360" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Why :-</text>
  <text x="80" y="382" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">True personalization  —  enough history to build a real taste profile</text>
  <text x="80" y="402" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">User's stage is updated to "regular"</text>

  <!-- Stage 4 -->
  <rect x="50" y="440" width="1100" height="328" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.4"/>
  <circle cx="90" cy="465" r="10" fill="#f38ba8"/>
  <text x="108" y="469" font-size="19" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Stage 4  —  Loyal    ( signalCount 20+ )</text>

  <text x="80" y="502" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">User :-</text>
  <text x="80" y="523" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">System knows this user very well</text>

  <text x="80" y="553" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Home sections :-</text>
  <line x1="100" y1="568" x2="100" y2="696" stroke="#f38ba8" stroke-width="0.7"/>

  <line x1="100" y1="575" x2="120" y2="575" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="128" y="580" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Handpicked For You  ( strongest personalization )</text>
  <text x="80" y="598" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  last 5 Favorites as seeds, weighted by added_at  ( newest = more important )</text>

  <line x1="100" y1="614" x2="120" y2="614" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="128" y="619" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Because You Loved  {top_favorite}</text>
  <text x="80" y="637" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  recommendations from the user's all-time top Favorite</text>

  <line x1="100" y1="653" x2="120" y2="653" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="128" y="658" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">New For You</text>
  <text x="80" y="676" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  new titles from dataset matching taste  —  not yet watched or added</text>

  <line x1="100" y1="692" x2="120" y2="692" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="128" y="697" font-size="14" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">Hidden Gems  ★  ( Future Feature )</text>
  <text x="80" y="716" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">         →  lesser-known titles likely to match taste</text>

  <text x="80" y="748" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">User's stage is updated to "loyal"</text>

  <line x1="50" y1="796" x2="1150" y2="796" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="810" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Stages 3 &amp; 4</text>
</svg>
