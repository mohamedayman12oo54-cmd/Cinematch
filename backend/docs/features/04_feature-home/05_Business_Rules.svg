<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <rect width="1200" height="580" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Business Rules :- Home Feature</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Rules left column -->
  <rect x="50" y="72" width="530" height="64" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="104" r="14" fill="#a6e3a1"/><text x="82" y="109" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">1</text>
  <text x="108" y="98" font-size="15" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Available to all users</text>
  <text x="108" y="120" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Public endpoint  —  no auth required</text>

  <rect x="50" y="148" width="530" height="74" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="185" r="14" fill="#f9e2af"/><text x="82" y="190" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">2</text>
  <text x="108" y="179" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Guest → Popular Titles  ( Cold Start )</text>
  <text x="108" y="199" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">No auth token  →  popular ML results only</text>
  <text x="108" y="215" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">stage = "stranger"   similarity_score = null</text>

  <rect x="50" y="234" width="530" height="64" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="266" r="14" fill="#94e2d5"/><text x="82" y="271" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">3</text>
  <text x="108" y="260" font-size="15" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">Stranger = same as Guest</text>
  <text x="108" y="282" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Logged in but signalCount = 0  →  popular only</text>

  <rect x="50" y="310" width="530" height="74" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="347" r="14" fill="#fab387"/><text x="82" y="352" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">4</text>
  <text x="108" y="341" font-size="15" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">Each Stage has different sections</text>
  <text x="108" y="361" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Stranger/Guest → 1 section (popular)</text>
  <text x="108" y="377" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Explorer → 2 sections   Regular → 3   Loyal → 4+</text>

  <!-- Rules right column -->
  <rect x="620" y="72" width="530" height="74" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="652" cy="109" r="14" fill="#cba6f7"/><text x="652" y="114" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">5</text>
  <text x="678" y="103" font-size="15" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">Results filtered before returning</text>
  <text x="678" y="123" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Titles in watched_titles filtered out</text>
  <text x="678" y="139" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Titles in favorites filtered out</text>

  <rect x="620" y="158" width="530" height="64" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="652" cy="190" r="14" fill="#f38ba8"/><text x="652" y="195" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">6</text>
  <text x="678" y="184" font-size="15" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Signals determine Stage at runtime</text>
  <text x="678" y="206" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount = count(favorites) + count(watched_titles)</text>

  <rect x="620" y="234" width="530" height="64" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="652" cy="266" r="14" fill="#89b4fa"/><text x="652" y="271" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">7</text>
  <text x="678" y="260" font-size="15" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend knows section type</text>
  <text x="678" y="282" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Each section has a "type" field  →  Frontend renders correct layout</text>

  <!-- Stage threshold table -->
  <rect x="50" y="400" width="1100" height="134" rx="6" fill="#181825" stroke="#313244" stroke-width="1.1"/>
  <text x="600" y="422" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Stage Thresholds :-</text>
  <line x1="70" y1="430" x2="1130" y2="430" stroke="#313244" stroke-width="0.7"/>
  <text x="140" y="454" font-size="13" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Stranger</text>
  <text x="140" y="474" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount = 0</text>
  <text x="400" y="454" font-size="13" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Explorer</text>
  <text x="400" y="474" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 1–4</text>
  <text x="700" y="454" font-size="13" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Regular</text>
  <text x="700" y="474" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 5–19</text>
  <text x="1000" y="454" font-size="13" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Loyal</text>
  <text x="1000" y="474" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 20+</text>
  <line x1="270" y1="436" x2="270" y2="526" stroke="#313244" stroke-width="0.6"/>
  <line x1="540" y1="436" x2="540" y2="526" stroke="#313244" stroke-width="0.6"/>
  <line x1="840" y1="436" x2="840" y2="526" stroke="#313244" stroke-width="0.6"/>
  <text x="600" y="506" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount = favorites count  +  watched_titles count  (calculated at runtime per request)</text>

  <line x1="50" y1="554" x2="1150" y2="554" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="568" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Business Rules</text>
</svg>
