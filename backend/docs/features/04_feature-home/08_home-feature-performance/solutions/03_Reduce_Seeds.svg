<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Fix 3 :- Reduce the Number of Seeds</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Not every seed adds equal value  —  newer Favorites matter more</text>

  <!-- Left: Seed value explanation -->
  <rect x="50" y="88" width="580" height="320" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.3"/>
  <text x="340" y="111" font-size="16" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Seed value — not all seeds are equal :-</text>
  <line x1="70" y1="119" x2="620" y2="119" stroke="#f9e2af" stroke-width="0.7"/>

  <text x="80" y="148" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Seeds are ordered by added_at DESC  ( newest Favorite first )</text>

  <!-- Seed rank bars -->
  <rect x="80" y="164" width="520" height="218" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>

  <!-- Seed 1 -->
  <text x="100" y="190" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">1st Seed  ( newest Favorite )</text>
  <rect x="380" y="176" width="180" height="20" rx="3" fill="#a6e3a1" fill-opacity="0.8" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="570" y="190" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">  →  most important</text>

  <!-- Seed 2 -->
  <text x="100" y="224" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">2nd Seed</text>
  <rect x="380" y="210" width="130" height="20" rx="3" fill="#f9e2af" fill-opacity="0.7" stroke="#f9e2af" stroke-width="0.6"/>
  <text x="518" y="224" font-size="12" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">  →  important</text>

  <!-- Seed 3 -->
  <text x="100" y="258" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">3rd Seed</text>
  <rect x="380" y="244" width="90" height="20" rx="3" fill="#fab387" fill-opacity="0.6" stroke="#fab387" stroke-width="0.6"/>
  <text x="476" y="258" font-size="12" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">  →  useful</text>

  <!-- Seed 4 + 5 -->
  <text x="100" y="292" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">4th Seed</text>
  <rect x="380" y="278" width="50" height="20" rx="3" fill="#45475a" stroke="#585b70" stroke-width="0.6"/>
  <text x="436" y="292" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">  →  marginal</text>

  <text x="100" y="326" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">5th Seed</text>
  <rect x="380" y="312" width="30" height="20" rx="3" fill="#313244" stroke="#45475a" stroke-width="0.6"/>
  <text x="416" y="326" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">  →  marginal</text>

  <text x="80" y="364" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Seeds 4 and 5 add very little on top of what 1–3 already cover</text>

  <!-- Right: Decision -->
  <rect x="670" y="88" width="480" height="180" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="910" y="111" font-size="16" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Decision :-</text>
  <line x1="690" y1="119" x2="1140" y2="119" stroke="#a6e3a1" stroke-width="0.7"/>

  <text x="690" y="148" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Cap max seeds at  3  —  even for Loyal User</text>
  <text x="690" y="172" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Seeds 4 and 5 cost 50ms each but add marginal value</text>
  <text x="690" y="194" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Cutting them saves 2 calls with almost no quality loss</text>
  <text x="690" y="222" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">3 seeds is the sweet spot:</text>
  <text x="690" y="244" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">enough variety to cover taste  +  fast enough to serve</text>

  <!-- Right: Result box -->
  <rect x="670" y="284" width="480" height="124" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="910" y="307" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Result :-</text>
  <line x1="690" y1="315" x2="1140" y2="315" stroke="#313244" stroke-width="0.7"/>

  <text x="690" y="344" font-size="14" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Before:   5 seeds × 50ms  =  250ms</text>
  <text x="690" y="370" font-size="14" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">After:      3 seeds × 50ms  =  150ms  ✅</text>
  <text x="690" y="396" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">100ms saved  with near-identical recommendation quality</text>

  <!-- Combined with parallel note -->
  <rect x="50" y="426" width="1100" height="90" rx="6" fill="#181825" stroke="#89b4fa" stroke-width="1.2"/>
  <text x="600" y="450" font-size="15" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Combined with Parallel Calls :-</text>
  <line x1="70" y1="458" x2="1130" y2="458" stroke="#89b4fa" stroke-width="0.7"/>
  <text x="600" y="484" font-size="13" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">3 seeds in parallel  =  max(50ms)  ≈  50ms   vs.   original 5 seeds sequential  =  250ms</text>
  <text x="600" y="506" font-size="13" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Total improvement:   250ms  →  50ms   —   5× faster  ✅</text>

  <line x1="50" y1="534" x2="1150" y2="534" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="550" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Fix 3: Reduce Seeds</text>
</svg>
