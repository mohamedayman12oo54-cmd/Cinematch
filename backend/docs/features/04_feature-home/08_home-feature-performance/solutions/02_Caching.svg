<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Fix 2 :- Caching  ( Long-term solution )</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">ML recommendations do not change every minute  —  cache them</text>

  <!-- Why caching works -->
  <rect x="50" y="88" width="530" height="200" rx="6" fill="#11111b" stroke="#94e2d5" stroke-width="1.3"/>
  <text x="315" y="111" font-size="16" fill="#94e2d5" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Why caching works here :-</text>
  <line x1="70" y1="119" x2="570" y2="119" stroke="#94e2d5" stroke-width="0.7"/>
  <text x="80" y="146" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">ML recommendations for "Breaking Bad"  →  same for all Users</text>
  <text x="80" y="168" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">They do not change every minute</text>
  <text x="80" y="190" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Dataset is static  →  results are stable</text>
  <text x="80" y="212" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  compute once, serve from cache many times</text>

  <text x="80" y="242" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Example:</text>
  <text x="80" y="262" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">recommendations("Breaking Bad")  =  same result for all Users</text>
  <text x="80" y="280" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">call ML once  →  save result  →  serve from cache forever (24h)</text>

  <!-- Cache key + TTL -->
  <rect x="620" y="88" width="530" height="200" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.3"/>
  <text x="885" y="111" font-size="16" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Cache configuration :-</text>
  <line x1="640" y1="119" x2="1140" y2="119" stroke="#f9e2af" stroke-width="0.7"/>
  <rect x="640" y="132" width="490" height="56" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="660" y="152" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Cache Key:  "ml:recommendations:{title}:{n}"</text>
  <text x="660" y="174" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">e.g.  "ml:recommendations:Breaking Bad:10"</text>
  <rect x="640" y="200" width="490" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="660" y="218" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Cache TTL:  24 hours</text>
  <text x="660" y="236" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">dataset does not change that fast  →  24h is safe</text>
  <text x="640" y="274" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Unique key per title + n ensures correct results</text>

  <!-- Code block -->
  <rect x="50" y="306" width="1100" height="226" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.2"/>
  <text x="600" y="328" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Implementation :-</text>
  <line x1="70" y1="336" x2="1130" y2="336" stroke="#313244" stroke-width="0.7"/>
  <rect x="70" y="346" width="1060" height="172" rx="4" fill="#181825" stroke="#45475a" stroke-width="0.8"/>
  <text x="90" y="370" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">public function getRecommendations(string $title, int $n = 10): array|null</text>
  <text x="90" y="390" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="90" y="410" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">    $cacheKey = "ml:recommendations:{$title}:{$n}";</text>
  <text x="90" y="434" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    return Cache::remember($cacheKey, now()-&gt;addHours(24), function() use ($title, $n) {</text>
  <text x="90" y="454" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">        // Only called if not in Cache — calls ML</text>
  <text x="90" y="474" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">        $response = Http::timeout($this-&gt;timeout)</text>
  <text x="90" y="494" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">                       -&gt;get("{$this-&gt;baseUrl}/recommend", ['title' =&gt; $title, 'n' =&gt; $n]);</text>
  <text x="90" y="514" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">        return $response-&gt;successful() ? $response-&gt;json() : null;</text>
  <text x="90" y="496" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    });</text>
  <text x="90" y="508" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Results -->
  <rect x="50" y="548" width="1100" height="174" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="600" y="571" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Results :-</text>
  <line x1="70" y1="579" x2="1130" y2="579" stroke="#a6e3a1" stroke-width="0.7"/>

  <rect x="70" y="590" width="490" height="112" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="315" y="612" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Per request :-</text>
  <text x="90" y="634" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">First request:     ≈ 50ms   ( ML call + cache save )</text>
  <text x="90" y="656" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Next requests:    ≈  1ms   ( served from Cache )  ✅</text>
  <text x="90" y="678" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">50× faster after first call</text>

  <rect x="620" y="590" width="490" height="112" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="865" y="612" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">At scale — 1000 users open Home :-</text>
  <text x="640" y="634" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Without cache:   1000 × 5 calls  =  5000 ML calls  ✗</text>
  <text x="640" y="656" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">With cache:          5 ML calls  ( one per unique title )  ✅</text>
  <text x="640" y="678" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">1000× fewer ML calls</text>

  <line x1="50" y1="740" x2="1150" y2="740" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="758" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Fix 2: Caching</text>
</svg>
