<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Fix 3 :- Lazy Loading  +  MVP Decision</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Future feature — better UX  |  MVP = Parallel + Caching only</text>

  <!-- Lazy Loading explanation -->
  <rect x="50" y="88" width="530" height="330" rx="6" fill="#11111b" stroke="#cba6f7" stroke-width="1.3"/>
  <text x="315" y="111" font-size="16" fill="#cba6f7" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Fix 3 — Lazy Loading Sections  ★ Future</text>
  <line x1="70" y1="119" x2="570" y2="119" stroke="#cba6f7" stroke-width="0.7"/>

  <text x="80" y="146" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Current approach :-</text>
  <text x="80" y="168" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">One request  →  responds with everything  →  user waits</text>

  <text x="80" y="200" font-size="14" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Lazy Loading approach :-</text>
  <text x="80" y="224" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home</text>
  <text x="260" y="224" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  returns structure  ( fast )</text>

  <text x="80" y="252" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend then requests each section independently:</text>
  <rect x="80" y="262" width="440" height="90" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="96" y="284" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home/sections/personalized</text>
  <text x="96" y="304" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home/sections/because-you-watched</text>
  <text x="96" y="324" font-size="12" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home/sections/popular</text>
  <text x="96" y="344" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">All called in parallel by Frontend</text>

  <text x="80" y="380" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend loads sections progressively as they arrive</text>
  <text x="80" y="400" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Better UX  ( page appears fast, content fills in )</text>

  <!-- MVP Decision -->
  <rect x="620" y="88" width="530" height="330" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="885" y="111" font-size="16" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">MVP Decision :-</text>
  <line x1="640" y1="119" x2="1140" y2="119" stroke="#a6e3a1" stroke-width="0.7"/>

  <text x="640" y="146" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">What to implement now :-</text>

  <rect x="640" y="158" width="490" height="96" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.9"/>
  <text x="660" y="180" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Parallel HTTP Calls  →  fast  +  simple</text>
  <text x="660" y="200" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    Http::pool() — already built into Laravel</text>
  <text x="660" y="222" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Caching (24h)  →  protects ML from overload</text>
  <text x="660" y="242" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    Cache::remember() — already built into Laravel</text>

  <text x="640" y="280" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">What to add later :-</text>

  <rect x="640" y="292" width="490" height="100" rx="4" fill="#181825" stroke="#fab387" stroke-width="0.9"/>
  <text x="660" y="314" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">★  Lazy Loading Sections</text>
  <text x="660" y="334" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    Better UX — page loads progressively</text>
  <text x="660" y="356" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">★  Background Job Cache Refresh</text>
  <text x="660" y="376" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    Update cache from File/DB instead of on-demand</text>

  <!-- All 3 comparison table -->
  <rect x="50" y="434" width="1100" height="300" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="600" y="457" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">All 3 Fixes Compared :-</text>
  <line x1="70" y1="465" x2="1130" y2="465" stroke="#313244" stroke-width="0.7"/>

  <!-- Table header -->
  <rect x="70" y="474" width="1060" height="28" rx="3" fill="#181825"/>
  <text x="200" y="492" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Fix</text>
  <text x="450" y="492" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Complexity</text>
  <text x="650" y="492" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Result</text>
  <text x="890" y="492" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">When</text>
  <line x1="70" y1="502" x2="1130" y2="502" stroke="#313244" stroke-width="0.5"/>

  <!-- Row 1 -->
  <text x="200" y="526" font-size="12" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Parallel HTTP Calls</text>
  <text x="450" y="526" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Low  ( Http::pool )</text>
  <text x="650" y="526" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">250ms → 50ms</text>
  <text x="890" y="526" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  MVP</text>
  <line x1="70" y1="536" x2="1130" y2="536" stroke="#313244" stroke-width="0.4"/>

  <!-- Row 2 -->
  <text x="200" y="560" font-size="12" fill="#94e2d5" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Caching  (24h)</text>
  <text x="450" y="560" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Low  ( Cache::remember )</text>
  <text x="650" y="560" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">50ms → 1ms after first</text>
  <text x="890" y="560" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  MVP</text>
  <line x1="70" y1="570" x2="1130" y2="570" stroke="#313244" stroke-width="0.4"/>

  <!-- Row 3 -->
  <text x="200" y="594" font-size="12" fill="#cba6f7" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Lazy Loading Sections</text>
  <text x="450" y="594" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Medium  ( new endpoints )</text>
  <text x="650" y="594" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Better UX</text>
  <text x="890" y="594" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">★  Future</text>
  <line x1="70" y1="604" x2="1130" y2="604" stroke="#313244" stroke-width="0.4"/>

  <!-- Row 4 -->
  <text x="200" y="628" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Background Job</text>
  <text x="450" y="628" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">High  ( Queue + Scheduler )</text>
  <text x="650" y="628" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Best cache freshness</text>
  <text x="890" y="628" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">★  Future</text>
  <line x1="70" y1="638" x2="1130" y2="638" stroke="#313244" stroke-width="0.4"/>

  <!-- Redis row -->
  <text x="200" y="662" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Redis Cache Driver</text>
  <text x="450" y="662" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Medium  ( config change )</text>
  <text x="650" y="662" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Faster than File/DB cache</text>
  <text x="890" y="662" font-size="12" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">★  Future</text>

  <rect x="70" y="678" width="1060" height="36" rx="3" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="600" y="701" font-size="13" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">MVP ships with Parallel + Caching  —  enough to protect ML and give fast response times</text>

  <line x1="50" y1="728" x2="1150" y2="728" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="746" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Feature  —  Fix 3: Lazy Loading + MVP Decision</text>
</svg>
