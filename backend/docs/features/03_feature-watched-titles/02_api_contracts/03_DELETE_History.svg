<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <rect width="1100" height="480" fill="#1e1e2e"/>

  <text x="550" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts :- DELETE /api/history/{title_name}</text>
  <line x1="60" y1="54" x2="1040" y2="54" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="60" y="68" width="90" height="28" rx="4" fill="#f38ba8" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="105" y="87" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">DELETE</text>
  <text x="165" y="87" font-size="15" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">/api/history/{title_name}</text>
  <text x="60" y="112" font-size="14" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Protected  —  auth:api  required</text>
  <text x="60" y="132" font-size="14" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Removes specified title from the authenticated user's Watch History</text>

  <!-- Response 200 -->
  <text x="60" y="160" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Response (200) :-</text>
  <rect x="60" y="168" width="980" height="100" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.2"/>
  <text x="80" y="194" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="216" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "success",</text>
  <text x="80" y="238" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Removed from Watch History"</text>
  <text x="80" y="259" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Error 404 -->
  <text x="60" y="294" font-size="15" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Error — Not in your Watch History  (404) :-</text>
  <rect x="60" y="302" width="980" height="100" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.0"/>
  <text x="80" y="328" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="350" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="80" y="372" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Title not in your Watch History"</text>
  <text x="80" y="394" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- note -->
  <rect x="60" y="418" width="980" height="36" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="550" y="441" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Scoped delete  —  user can only remove entries from their own Watch History  ( WHERE user_id = auth user )</text>

  <line x1="50" y1="462" x2="1050" y2="462" stroke="#313244" stroke-width="0.7"/>
  <text x="550" y="474" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Watched Titles Feature  —  DELETE Endpoint</text>
</svg>
