<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <rect width="1100" height="780" fill="#1e1e2e"/>

  <text x="550" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts :- POST /api/history</text>
  <line x1="60" y1="54" x2="1040" y2="54" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="60" y="68" width="72" height="28" rx="4" fill="#a6e3a1" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="96" y="87" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST</text>
  <text x="148" y="87" font-size="15" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">/api/history</text>
  <text x="60" y="112" font-size="14" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Protected  —  auth:api  required</text>

  <!-- Request -->
  <text x="60" y="138" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Request Body :-</text>
  <rect x="60" y="146" width="980" height="66" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.2"/>
  <text x="80" y="170" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="192" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "title_name": "Better Call Saul"</text>
  <text x="80" y="204" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Response 201 -->
  <text x="60" y="234" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Response (201) :-</text>
  <rect x="60" y="242" width="980" height="274" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.2"/>
  <text x="80" y="268" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="290" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "success",</text>
  <text x="80" y="312" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Marked as Watched",</text>
  <text x="80" y="334" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="80" y="356" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">        "id":           1,</text>
  <text x="80" y="378" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">        "title_name":   "Better Call Saul",</text>
  <text x="80" y="400" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">        "title_type":   "TV Show",</text>
  <text x="80" y="422" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">        "genres":       "Crime, Drama",</text>
  <text x="80" y="444" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">        "release_year": 2015,</text>
  <text x="80" y="466" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "watched_at":   "2024-01-16T22:00:00Z"</text>
  <text x="80" y="488" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="80" y="506" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Error 422 -->
  <text x="60" y="538" font-size="15" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Error — Already watched  (422) :-</text>
  <rect x="60" y="546" width="980" height="78" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.0"/>
  <text x="80" y="570" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="592" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="80" y="614" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Title already in your Watch History"</text>
  <text x="80" y="616" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Error 404 -->
  <text x="60" y="648" font-size="15" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Error — Title not found in ML  (404) :-</text>
  <rect x="60" y="656" width="980" height="78" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.0"/>
  <text x="80" y="680" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="80" y="702" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="80" y="724" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Title not found"</text>
  <text x="80" y="728" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <line x1="50" y1="758" x2="1050" y2="758" stroke="#313244" stroke-width="0.7"/>
  <text x="550" y="771" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Backend calls ML getTitleDetail() to fetch genres snapshot before storing</text>
</svg>
