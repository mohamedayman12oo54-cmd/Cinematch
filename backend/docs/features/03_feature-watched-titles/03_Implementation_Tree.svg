<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#1e1e2e"/>

  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Implementation Tree :- Watched Titles Feature</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Build order — each phase depends on the previous</text>

  <!-- Phase 1 -->
  <rect x="50" y="88" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="116" r="14" fill="#f38ba8" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="121" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">1</text>
  <text x="108" y="114" font-size="17" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">StoreWatchedTitleRequest</text>
  <text x="510" y="114" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Http/Requests/StoreWatchedTitleRequest.php</text>
  <line x1="82" y1="130" x2="82" y2="158" stroke="#f38ba8" stroke-width="0.6"/>
  <line x1="82" y1="144" x2="102" y2="144" stroke="#f38ba8" stroke-width="0.6"/>
  <text x="110" y="149" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">title_name:  required,  string</text>

  <!-- Phase 2 -->
  <rect x="50" y="178" width="1100" height="120" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="206" r="14" fill="#94e2d5" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="211" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">2</text>
  <text x="108" y="204" font-size="17" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">WatchedTitleService</text>
  <text x="420" y="204" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Services/WatchedTitleService.php</text>
  <line x1="82" y1="220" x2="82" y2="290" stroke="#94e2d5" stroke-width="0.6"/>
  <line x1="82" y1="234" x2="102" y2="234" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="239" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">getHistory(User)</text>
  <text x="500" y="239" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  list ordered by watched_at DESC</text>
  <line x1="82" y1="256" x2="102" y2="256" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="261" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">addWatched(User, title_name)</text>
  <text x="500" y="261" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  create + call ML for genres snapshot</text>
  <line x1="82" y1="274" x2="102" y2="274" stroke="#94e2d5" stroke-width="0.6"/>
  <text x="110" y="279" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">removeWatched(User, title_name)</text>
  <text x="500" y="279" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  delete scoped to user</text>

  <!-- Phase 3 -->
  <rect x="50" y="310" width="1100" height="78" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="338" r="14" fill="#cba6f7" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="343" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">3</text>
  <text x="108" y="336" font-size="17" fill="#cba6f7" font-family="Excalifont, 'Comic Sans MS', cursive">WatchedTitleResource</text>
  <text x="430" y="336" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Http/Resources/WatchedTitleResource.php</text>
  <line x1="82" y1="352" x2="82" y2="380" stroke="#cba6f7" stroke-width="0.6"/>
  <line x1="82" y1="366" x2="102" y2="366" stroke="#cba6f7" stroke-width="0.6"/>
  <text x="110" y="371" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Formats response  —  id, title_name, title_type, genres, release_year, watched_at</text>

  <!-- Phase 4 -->
  <rect x="50" y="400" width="1100" height="120" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="428" r="14" fill="#a6e3a1" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="433" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">4</text>
  <text x="108" y="426" font-size="17" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">WatchedTitleController</text>
  <text x="430" y="426" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">app/Http/Controllers/Api/WatchedTitleController.php</text>
  <line x1="82" y1="442" x2="82" y2="512" stroke="#a6e3a1" stroke-width="0.6"/>
  <line x1="82" y1="456" x2="102" y2="456" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="461" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">index()</text>
  <text x="300" y="461" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  GET     /api/history</text>
  <line x1="82" y1="474" x2="102" y2="474" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="479" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">store()</text>
  <text x="300" y="479" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  POST    /api/history</text>
  <line x1="82" y1="492" x2="102" y2="492" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="110" y="497" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">destroy()</text>
  <text x="300" y="497" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  DELETE  /api/history/{title_name}</text>

  <!-- Phase 5 -->
  <rect x="50" y="532" width="1100" height="68" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="560" r="14" fill="#f9e2af" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="565" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">5</text>
  <text x="108" y="558" font-size="17" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Routes</text>
  <text x="260" y="558" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">routes/api.php</text>
  <line x1="82" y1="574" x2="82" y2="592" stroke="#f9e2af" stroke-width="0.6"/>
  <line x1="82" y1="583" x2="102" y2="583" stroke="#f9e2af" stroke-width="0.6"/>
  <text x="110" y="588" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Protected  →  middleware: auth:api</text>

  <!-- Phase 6 -->
  <rect x="50" y="612" width="1100" height="100" rx="6" fill="#11111b" stroke="#cdd6f4" stroke-width="1.1"/>
  <circle cx="82" cy="640" r="14" fill="#fab387" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="82" y="645" font-size="13" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">6</text>
  <text x="108" y="638" font-size="17" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">Tests</text>
  <text x="240" y="638" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">tests/Feature/Api/WatchedTitleTest.php</text>
  <line x1="82" y1="654" x2="82" y2="704" stroke="#fab387" stroke-width="0.6"/>
  <line x1="82" y1="663" x2="102" y2="663" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="668" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Happy Path  —  mark and list watched titles</text>
  <line x1="82" y1="678" x2="102" y2="678" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="683" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Duplicate Prevention  —  422 on second mark</text>
  <line x1="82" y1="694" x2="102" y2="694" stroke="#fab387" stroke-width="0.6"/>
  <text x="110" y="699" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Data Isolation  —  user sees only their own history</text>

  <line x1="50" y1="738" x2="1150" y2="738" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="752" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Watched Titles Feature  —  Implementation Tree</text>
</svg>
