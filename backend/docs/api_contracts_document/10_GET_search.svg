<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /search?q={query}&amp;limit={n}</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Autocomplete search — proxied to ML Model</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#89b4fa" stroke="#89b4fa" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET</text>
  <text x="172" y="115" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="1120" y="115" font-size="13" fill="#fab387" text-anchor="end" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit: 60/minute</text>
  <rect x="50" y="148" width="1100" height="98" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="70" y="170" font-size="15" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Query Parameters :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#f9e2af" stroke-width="0.6"/>
  <rect x="70" y="184" width="150" height="20" rx="3" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <text x="80" y="198" font-size="13" fill="#94e2d5" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">q</text>
  <text x="230" y="198" font-size="13" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  required,  min 2 characters  —  search query string</text>
  <rect x="70" y="210" width="150" height="20" rx="3" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <text x="80" y="224" font-size="13" fill="#94e2d5" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">limit</text>
  <text x="230" y="224" font-size="13" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  optional,  default 12,  max 12  —  number of results</text>
  <rect x="50" y="260" width="1100" height="254" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="282" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  OK :-</text>
  <line x1="70" y1="290" x2="1130" y2="290" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="296" width="1060" height="208" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="316" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="336" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="356" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": [</text>
  <text x="88" y="376" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        {</text>
  <text x="88" y="396" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "title":        "Breaking Bad",</text>
  <text x="88" y="416" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "type":         "TV Show",</text>
  <text x="88" y="436" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "release_year": 2008</text>
  <text x="88" y="456" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        }</text>
  <text x="88" y="476" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    ]</text>
  <text x="88" y="496" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="528" width="1100" height="146" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="550" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="558" x2="1130" y2="558" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="564" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="570" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="589" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">422</text>
  <text x="152" y="582" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Validation Error</text>
  <text x="152" y="600" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">q is less than 2 characters</text>
  <rect x="70" y="614" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="620" width="60" height="30" rx="4" fill="#cba6f7" stroke="transparent" stroke-width="0"/>
  <text x="110" y="639" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">503</text>
  <text x="152" y="632" font-size="14" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML Service Unavailable</text>
  <text x="152" y="650" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML model is down — Graceful Degradation returns empty results</text>
  <rect x="50" y="688" width="1100" height="88" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="710" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="718" x2="1130" y2="718" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="738" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  Results ordered by similarity to query — most relevant first</text>
  <text x="80" y="760" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  No auth needed — search is public for all users</text>
  <line x1="50" y1="800" x2="1150" y2="800" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="814" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  GET /search?q={query}&amp;limit={n}</text>
</svg>