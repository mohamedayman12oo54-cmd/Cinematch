<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956">
  <rect width="1200" height="956" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /recommendations/{title}?n={n}</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Get ML recommendations based on a title — user_signals added if authenticated</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#89b4fa" stroke="#89b4fa" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET</text>
  <text x="172" y="115" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="1120" y="115" font-size="13" fill="#fab387" text-anchor="end" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit: 60/minute</text>
  <rect x="50" y="148" width="1100" height="72" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="70" y="170" font-size="15" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Query Parameters :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#f9e2af" stroke-width="0.6"/>
  <rect x="70" y="184" width="150" height="20" rx="3" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <text x="80" y="198" font-size="13" fill="#94e2d5" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">n</text>
  <text x="230" y="198" font-size="13" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  optional,  default 10,  max 50  —  number of recommendations</text>
  <rect x="50" y="234" width="1100" height="394" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="256" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  OK :-</text>
  <line x1="70" y1="264" x2="1130" y2="264" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="270" width="1060" height="348" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="290" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="310" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="330" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="350" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "query":         "Breaking Bad",</text>
  <text x="88" y="370" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "matched_title": "Breaking Bad",</text>
  <text x="88" y="390" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "total":         10,</text>
  <text x="88" y="410" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "results": [</text>
  <text x="88" y="430" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            {</text>
  <text x="88" y="450" font-size="13" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "title":            "Better Call Saul",</text>
  <text x="88" y="470" font-size="13" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "type":             "TV Show",</text>
  <text x="88" y="490" font-size="13" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "release_year":     2015,</text>
  <text x="88" y="510" font-size="13" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "similarity_score": 0.98,</text>
  <text x="88" y="530" font-size="13" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "user_signals": null  // or {is_favorite, is_watched}</text>
  <text x="88" y="550" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            }</text>
  <text x="88" y="570" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        ]</text>
  <text x="88" y="590" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="610" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="642" width="1100" height="146" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="664" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="672" x2="1130" y2="672" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="678" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="684" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="703" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">404</text>
  <text x="152" y="696" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Not Found</text>
  <text x="152" y="714" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Title does not exist in ML dataset</text>
  <rect x="70" y="728" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="734" width="60" height="30" rx="4" fill="#cba6f7" stroke="transparent" stroke-width="0"/>
  <text x="110" y="753" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">503</text>
  <text x="152" y="746" font-size="14" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML Service Unavailable</text>
  <text x="152" y="764" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML model is down — empty results returned</text>
  <rect x="50" y="802" width="1100" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="824" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="832" x2="1130" y2="832" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="852" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  similarity_score: 0.0–1.0  —  higher = more similar</text>
  <text x="80" y="874" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  user_signals added per result for authenticated users</text>
  <text x="80" y="896" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  Results filtered: titles already in Favorites / Watch History are excluded</text>
  <line x1="50" y1="936" x2="1150" y2="936" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="950" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  GET /recommendations/{title}?n={n}</text>
</svg>