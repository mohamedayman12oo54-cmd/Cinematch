<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Response Format :- Consistent across all API</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Every endpoint returns the same JSON shape — driven by ApiResponse Helper</text>

  <!-- Success -->
  <rect x="50" y="88" width="530" height="170" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="315" y="111" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Success  ( 200 / 201 ) :-</text>
  <line x1="70" y1="119" x2="570" y2="119" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="128" width="490" height="112" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="152" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="172" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "success",</text>
  <text x="88" y="192" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "optional",</text>
  <text x="88" y="212" font-size="13" fill="#89b4fa" font-family="Excalifont, 'Comic Sans MS', cursive">    "data":    { ... }  or  [ ... ]</text>
  <text x="88" y="232" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Error -->
  <rect x="620" y="88" width="530" height="170" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.3"/>
  <text x="885" y="111" font-size="15" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Error  ( 4xx / 5xx ) :-</text>
  <line x1="640" y1="119" x2="1140" y2="119" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="640" y="128" width="490" height="112" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="658" y="152" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="658" y="172" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="658" y="192" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "human-readable message for User"</text>
  <text x="658" y="232" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Validation Error -->
  <rect x="50" y="276" width="530" height="200" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.3"/>
  <text x="315" y="299" font-size="15" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Validation Error  ( 422 ) :-</text>
  <line x1="70" y1="307" x2="570" y2="307" stroke="#f9e2af" stroke-width="0.7"/>
  <rect x="70" y="316" width="490" height="142" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="340" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="360" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="88" y="380" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Data is not valid",</text>
  <text x="88" y="400" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">    "errors":  {</text>
  <text x="88" y="420" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">        "field_name": ["Error message"]</text>
  <text x="88" y="440" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="450" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>

  <!-- Rate Limit -->
  <rect x="620" y="276" width="530" height="200" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.3"/>
  <text x="885" y="299" font-size="15" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit  ( 429 ) :-</text>
  <line x1="640" y1="307" x2="1140" y2="307" stroke="#fab387" stroke-width="0.7"/>
  <rect x="640" y="316" width="490" height="142" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="658" y="340" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="658" y="360" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "error",</text>
  <text x="658" y="380" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Too many attempts — try again later",</text>
  <text x="658" y="400" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">    "retry_after": 60</text>
  <text x="658" y="450" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <text x="658" y="430" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">    // retry_after = seconds until limit resets</text>

  <!-- Rules note -->
  <rect x="50" y="494" width="1100" height="180" rx="6" fill="#181825" stroke="#313244" stroke-width="1.0"/>
  <text x="600" y="518" font-size="15" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Rules for all responses :-</text>
  <line x1="70" y1="526" x2="1130" y2="526" stroke="#313244" stroke-width="0.7"/>
  <text x="80" y="552" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">→  status is always  "success"  or  "error"  — never anything else</text>
  <text x="80" y="576" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  message field is optional on success,  always present on error</text>
  <text x="80" y="600" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  errors field only present on 422 Validation Error  — contains field-level details</text>
  <text x="80" y="624" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  retry_after field only present on 429 Rate Limit  — seconds until the limit resets</text>
  <text x="80" y="648" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">→  No raw stack traces ever exposed — all handled by Global Exception Handler</text>

  <line x1="50" y1="690" x2="1150" y2="690" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="706" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  Response Format</text>
</svg>
