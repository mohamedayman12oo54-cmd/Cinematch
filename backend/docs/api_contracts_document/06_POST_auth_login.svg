<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890">
  <rect width="1200" height="890" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST /auth/login</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Authenticate user credentials — returns JWT token</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST</text>
  <text x="172" y="115" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="1120" y="115" font-size="13" fill="#fab387" text-anchor="end" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit: 5/minute</text>
  <rect x="50" y="148" width="1100" height="130" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="70" y="170" font-size="15" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Request Body :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#f9e2af" stroke-width="0.6"/>
  <rect x="70" y="184" width="1060" height="86" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="224" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "email":    "ahmed@example.com",</text>
  <text x="88" y="244" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "password": "password123"</text>
  <text x="88" y="264" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="292" width="1100" height="314" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="314" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  OK :-</text>
  <line x1="70" y1="322" x2="1130" y2="322" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="328" width="1060" height="268" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="348" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="368" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="388" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="408" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "user": {</text>
  <text x="88" y="428" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "id":    1,</text>
  <text x="88" y="448" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "email": "ahmed@example.com",</text>
  <text x="88" y="468" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "stage": "regular"</text>
  <text x="88" y="488" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        },</text>
  <text x="88" y="508" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token":      "eyJ...",</text>
  <text x="88" y="528" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token_type": "bearer",</text>
  <text x="88" y="548" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "expires_in": 3600</text>
  <text x="88" y="568" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="588" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="620" width="1100" height="146" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="642" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="650" x2="1130" y2="650" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="656" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="662" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="681" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">401</text>
  <text x="152" y="674" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Unauthenticated</text>
  <text x="152" y="692" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Wrong email or password</text>
  <rect x="70" y="706" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="712" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="731" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">429</text>
  <text x="152" y="724" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit Exceeded</text>
  <text x="152" y="742" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Too many attempts  —  response includes  retry_after: 60</text>
  <rect x="50" y="780" width="1100" height="66" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="802" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="810" x2="1130" y2="810" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="830" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  stage reflects current user progress — changes as user adds Favorites / Watched</text>
  <line x1="50" y1="870" x2="1150" y2="870" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="884" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  POST /auth/login</text>
</svg>