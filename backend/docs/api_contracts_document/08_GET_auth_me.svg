<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486">
  <rect width="1200" height="486" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /auth/me  🔒</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Get the currently authenticated user data</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#89b4fa" stroke="#89b4fa" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET</text>
  <rect x="172" y="97" width="180" height="28" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.9"/>
  <text x="262" y="115" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">🔒  auth:api  required</text>
  <rect x="50" y="148" width="1100" height="214" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="170" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  OK :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="184" width="1060" height="168" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="224" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="244" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="264" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "id":    1,</text>
  <text x="88" y="284" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "email": "ahmed@example.com",</text>
  <text x="88" y="304" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "stage": "regular"</text>
  <text x="88" y="324" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="344" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="376" width="1100" height="66" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="398" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="406" x2="1130" y2="406" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="426" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  stage is recalculated on every request — always reflects current signalCount</text>
  <line x1="50" y1="466" x2="1150" y2="466" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="480" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  GET /auth/me</text>
