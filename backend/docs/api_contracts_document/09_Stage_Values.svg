<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Stage Values :- Important for Frontend</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">stage field returned in GET /api/home response  —  tells Frontend which layout to render</text>

  <!-- Stage cards -->
  <rect x="50" y="88" width="255" height="200" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <text x="178" y="113" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">stranger</text>
  <text x="178" y="135" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount = 0</text>
  <line x1="70" y1="143" x2="285" y2="143" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="70" y="166" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">New user — no data yet</text>
  <text x="70" y="188" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Home: Popular only</text>
  <text x="70" y="210" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend: Show Search + Popular</text>
  <text x="70" y="232" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">similarity_score: null</text>
  <text x="70" y="272" font-size="11" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Guest = same layout</text>

  <rect x="328" y="88" width="255" height="200" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1.4"/>
  <text x="456" y="113" font-size="15" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">explorer</text>
  <text x="456" y="135" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 1–4</text>
  <line x1="348" y1="143" x2="563" y2="143" stroke="#89b4fa" stroke-width="0.7"/>
  <text x="348" y="166" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Starting to add signals</text>
  <text x="348" y="188" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Home: Favorites-based + Popular</text>
  <text x="348" y="210" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend: Light Personalized + Popular</text>
  <text x="348" y="232" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">2 sections</text>

  <rect x="606" y="88" width="255" height="200" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.4"/>
  <text x="734" y="113" font-size="15" fill="#fab387" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">regular</text>
  <text x="734" y="135" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 5–19</text>
  <line x1="626" y1="143" x2="841" y2="143" stroke="#fab387" stroke-width="0.7"/>
  <text x="626" y="166" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Established user</text>
  <text x="626" y="188" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Home: Full personalization</text>
  <text x="626" y="210" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend: Show all Sections</text>
  <text x="626" y="232" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">3 sections</text>

  <rect x="884" y="88" width="268" height="200" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.4"/>
  <text x="1018" y="113" font-size="15" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">loyal</text>
  <text x="1018" y="135" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount 20+</text>
  <line x1="904" y1="143" x2="1132" y2="143" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="904" y="166" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Power user</text>
  <text x="904" y="188" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Home: Strongest personalization</text>
  <text x="904" y="210" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend: All Sections + More items</text>
  <text x="904" y="232" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">4+ sections</text>

  <!-- signalCount formula -->
  <rect x="50" y="306" width="600" height="60" rx="6" fill="#181825" stroke="#313244" stroke-width="1.0"/>
  <text x="350" y="328" font-size="14" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">signalCount formula :-</text>
  <text x="350" y="352" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">count( favorites )  +  count( watched_titles )  —  calculated per request</text>

  <!-- Why Frontend needs stage -->
  <rect x="50" y="382" width="1100" height="96" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="600" y="406" font-size="15" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Why Frontend needs stage :-</text>
  <line x1="70" y1="414" x2="1130" y2="414" stroke="#f9e2af" stroke-width="0.7"/>
  <text x="80" y="438" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">→  Renders the appropriate UI for each stage  ( different layouts, different section counts )</text>
  <text x="80" y="460" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  Knows which sections to expect in the Home response  ( type field per section )</text>

  <line x1="50" y1="492" x2="1150" y2="492" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="508" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  Stage Values</text>
</svg>
