<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST /auth/refresh  🔒</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Refresh the JWT token — returns a new valid token</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST</text>
  <rect x="172" y="97" width="180" height="28" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.9"/>
  <text x="262" y="115" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">🔒  auth:api  required</text>
  <rect x="50" y="148" width="1100" height="214" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="170" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  OK :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="184" width="1060" height="168" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="224" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="244" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="264" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token":      "eyJ...",</text>
  <text x="88" y="284" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token_type": "bearer",</text>
  <text x="88" y="304" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "expires_in": 3600</text>
  <text x="88" y="324" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="344" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="376" width="1100" height="96" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="398" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="406" x2="1130" y2="406" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="412" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="418" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="437" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">401</text>
  <text x="152" y="430" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Unauthenticated</text>
  <text x="152" y="448" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Token is invalid or already expired — cannot refresh</text>
  <rect x="50" y="486" width="1100" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="508" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="516" x2="1130" y2="516" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="536" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  Frontend should call this automatically when a 401 is received on any protected endpoint</text>
  <text x="80" y="558" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  If refresh also returns 401  →  clear token, Logout, Redirect to Login</text>
  <text x="80" y="580" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  No request body needed  —  old token is taken from Authorization header</text>
  <line x1="50" y1="620" x2="1150" y2="620" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="634" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  POST /auth/refresh</text>
</svg>