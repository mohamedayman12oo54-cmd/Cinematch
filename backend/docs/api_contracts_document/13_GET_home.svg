<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1232" viewBox="0 0 1200 1232">
  <rect width="1200" height="1232" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /home</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Personalized home page — response varies by user stage</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#89b4fa" stroke="#89b4fa" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET</text>
  <text x="172" y="115" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="1120" y="115" font-size="13" fill="#fab387" text-anchor="end" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit: 60/minute</text>
  <rect x="50" y="148" width="1100" height="454" rx="6" fill="#11111b" stroke="#94e2d5" stroke-width="1.2"/>
  <text x="70" y="170" font-size="15" fill="#94e2d5" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  Guest / Stranger  ( signalCount = 0 ) :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#94e2d5" stroke-width="0.7"/>
  <rect x="70" y="184" width="1060" height="408" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="224" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="244" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="264" font-size="13" fill="#94e2d5" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "stage": "stranger",</text>
  <text x="88" y="284" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "sections": [</text>
  <text x="88" y="304" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            {</text>
  <text x="88" y="324" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "type":  "popular",</text>
  <text x="88" y="344" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "title": "Popular on Netflix",</text>
  <text x="88" y="364" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                "items": [</text>
  <text x="88" y="384" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                    {</text>
  <text x="88" y="404" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                        "title":            "Breaking Bad",</text>
  <text x="88" y="424" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                        "type":             "TV Show",</text>
  <text x="88" y="444" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                        "release_year":     2008,</text>
  <text x="88" y="464" font-size="13" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                        "similarity_score": null</text>
  <text x="88" y="484" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                    }</text>
  <text x="88" y="504" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">                ]</text>
  <text x="88" y="524" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            }</text>
  <text x="88" y="544" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        ]</text>
  <text x="88" y="564" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="584" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="616" width="1100" height="294" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1.2"/>
  <text x="70" y="638" font-size="15" fill="#fab387" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 200 )  —  Regular User  ( signalCount 5–19 ) :-</text>
  <line x1="70" y1="646" x2="1130" y2="646" stroke="#fab387" stroke-width="0.7"/>
  <rect x="70" y="652" width="1060" height="248" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="672" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="692" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status": "success",</text>
  <text x="88" y="712" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="732" font-size="13" fill="#fab387" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "stage": "regular",</text>
  <text x="88" y="752" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "sections": [</text>
  <text x="88" y="772" font-size="13" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            { "type": "personalized",         "title": "Handpicked For You",              "items": [...] },</text>
  <text x="88" y="792" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            { "type": "because_you_watched",  "title": "Because You Watched Mindhunter",</text>
  <text x="88" y="812" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">              "seed_title": "Mindhunter",     "items": [...] },</text>
  <text x="88" y="832" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            { "type": "popular",              "title": "Popular on Netflix",  "items": [...] }</text>
  <text x="88" y="852" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        ]</text>
  <text x="88" y="872" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="892" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="924" width="1100" height="96" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="946" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="954" x2="1130" y2="954" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="960" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="966" width="60" height="30" rx="4" fill="#cba6f7" stroke="transparent" stroke-width="0"/>
  <text x="110" y="985" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">503</text>
  <text x="152" y="978" font-size="14" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML Service Unavailable</text>
  <text x="152" y="996" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML is down — sections returned with items: []  ( Graceful Degradation )</text>
  <rect x="50" y="1034" width="1100" height="154" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="1056" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="1064" x2="1130" y2="1064" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="1084" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  Section types:  popular  /  personalized  /  because_you_watched  /  because_you_loved</text>
  <text x="80" y="1106" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  items: []  =  Frontend should hide that section  ( do not render empty sections )</text>
  <text x="80" y="1128" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  sections: []  =  Frontend should show Empty State UI</text>
  <text x="80" y="1150" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  seed_title field only present on  because_you_watched  and  because_you_loved  sections</text>
  <text x="80" y="1172" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  similarity_score is null for popular results  —  actual score for ML-personalized results</text>
  <line x1="50" y1="1212" x2="1150" y2="1212" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="1226" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  GET /home</text>
</svg>