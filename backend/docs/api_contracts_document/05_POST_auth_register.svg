<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="902" viewBox="0 0 1200 902">
  <rect width="1200" height="902" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST /auth/register</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Register a new user account — JWT token returned immediately</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST</text>
  <text x="172" y="115" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Public  —  no auth required</text>
  <text x="1120" y="115" font-size="13" fill="#fab387" text-anchor="end" font-family="Excalifont, 'Comic Sans MS', cursive">Rate Limit: 10/minute</text>
  <rect x="50" y="148" width="1100" height="150" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="70" y="170" font-size="15" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Request Body :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#f9e2af" stroke-width="0.6"/>
  <rect x="70" y="184" width="1060" height="106" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{ </text>
  <text x="88" y="224" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "email":                "ahmed@example.com",</text>
  <text x="88" y="244" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "password":             "password123",</text>
  <text x="88" y="264" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "password_confirmation": "password123"</text>
  <text x="88" y="284" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="312" width="1100" height="334" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="334" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 201 )  —  Created :-</text>
  <line x1="70" y1="342" x2="1130" y2="342" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="348" width="1060" height="288" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="368" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="388" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "success",</text>
  <text x="88" y="408" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Account created successfully",</text>
  <text x="88" y="428" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="448" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "user": {</text>
  <text x="88" y="468" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "id":    1,</text>
  <text x="88" y="488" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "email": "ahmed@example.com",</text>
  <text x="88" y="508" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "stage": "stranger"</text>
  <text x="88" y="528" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        },</text>
  <text x="88" y="548" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token":      "eyJ...",</text>
  <text x="88" y="568" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "token_type": "bearer",</text>
  <text x="88" y="588" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        "expires_in": 3600</text>
  <text x="88" y="608" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="628" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="660" width="1100" height="96" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="682" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="690" x2="1130" y2="690" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="696" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="702" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="721" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">422</text>
  <text x="152" y="714" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Validation Error</text>
  <text x="152" y="732" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">email already exists  /  password too weak  /  fields missing</text>
  <rect x="50" y="770" width="1100" height="88" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="792" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="800" x2="1130" y2="800" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="820" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  No separate login needed after register — JWT token returned immediately</text>
  <text x="80" y="842" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  stage is always "stranger" on first registration</text>
  <line x1="50" y1="882" x2="1150" y2="882" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="896" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  POST /auth/register</text>
</svg>