<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="962" viewBox="0 0 1200 962">
  <rect width="1200" height="962" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST /history  🔒</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="72" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Mark a title as watched — ML called once to store genres snapshot</text>
  <rect x="50" y="88" width="1100" height="46" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <rect x="68" y="96" width="90" height="30" rx="4" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="0"/>
  <text x="113" y="116" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">POST</text>
  <rect x="172" y="97" width="180" height="28" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.9"/>
  <text x="262" y="115" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">🔒  auth:api  required</text>
  <rect x="50" y="148" width="1100" height="110" rx="6" fill="#11111b" stroke="#313244" stroke-width="1.1"/>
  <text x="70" y="170" font-size="15" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Request Body :-</text>
  <line x1="70" y1="178" x2="1130" y2="178" stroke="#f9e2af" stroke-width="0.6"/>
  <rect x="70" y="184" width="1060" height="66" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="204" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="224" font-size="13" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "title_name": "Better Call Saul"</text>
  <text x="88" y="244" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="272" width="1100" height="334" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="70" y="294" font-size="15" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Response  ( 201 )  —  Created :-</text>
  <line x1="70" y1="302" x2="1130" y2="302" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="70" y="308" width="1060" height="288" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="328" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">{</text>
  <text x="88" y="348" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "status":  "success",</text>
  <text x="88" y="368" font-size="13" fill="#a6e3a1" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "message": "Marked as Watched",</text>
  <text x="88" y="388" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    "data": {</text>
  <text x="88" y="408" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        {</text>
  <text x="88" y="428" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "id":           1,</text>
  <text x="88" y="448" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "title_name":   "Better Call Saul",</text>
  <text x="88" y="468" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "title_type":   "TV Show",</text>
  <text x="88" y="488" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "genres":       "Crime, Drama",</text>
  <text x="88" y="508" font-size="13" fill="#89b4fa" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "release_year": 2015,</text>
  <text x="88" y="528" font-size="13" fill="#f9e2af" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">            "watched_at":   "2024-01-16T22:00:00.000000Z"</text>
  <text x="88" y="548" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">        }</text>
  <text x="88" y="568" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">    }</text>
  <text x="88" y="588" font-size="13" fill="#cdd6f4" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">}</text>
  <rect x="50" y="620" width="1100" height="196" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="70" y="642" font-size="15" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="650" x2="1130" y2="650" stroke="#f38ba8" stroke-width="0.7"/>
  <rect x="70" y="656" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="662" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="681" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">422</text>
  <text x="152" y="674" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Duplicate</text>
  <text x="152" y="692" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Title already in your Watch History  —  UNIQUE(user_id, title_name)</text>
  <rect x="70" y="706" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="712" width="60" height="30" rx="4" fill="#f38ba8" stroke="transparent" stroke-width="0"/>
  <text x="110" y="731" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">404</text>
  <text x="152" y="724" font-size="14" fill="#f38ba8" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Not Found</text>
  <text x="152" y="742" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Title not found in ML dataset</text>
  <rect x="70" y="756" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <rect x="80" y="762" width="60" height="30" rx="4" fill="#cba6f7" stroke="transparent" stroke-width="0"/>
  <text x="110" y="781" font-size="14" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">503</text>
  <text x="152" y="774" font-size="14" fill="#cba6f7" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">ML Service Unavailable</text>
  <text x="152" y="792" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Cannot fetch genres snapshot  —  request fails</text>
  <rect x="50" y="830" width="1100" height="88" rx="6" fill="#181825" stroke="#313244" stroke-width="0.9"/>
  <text x="70" y="852" font-size="14" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">Notes :-</text>
  <line x1="70" y1="860" x2="1130" y2="860" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="880" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  Backend calls ML getTitleDetail() to fetch genres snapshot before storing</text>
  <text x="80" y="902" font-size="12" fill="#6c7086" text-anchor="start" font-family="Excalifont, 'Comic Sans MS', cursive">→  watched_at is set automatically by the server — cannot be set by client</text>
  <line x1="50" y1="942" x2="1150" y2="942" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="956" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  POST /history</text>
</svg>