<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <rect width="1100" height="360" fill="#1e1e2e"/>
  <text x="550" y="44" font-size="28" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Authentication :- How it works</text>
  <line x1="60" y1="55" x2="1040" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Header requirement -->
  <rect x="50" y="72" width="1000" height="80" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.3"/>
  <text x="70" y="96" font-size="15" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Every Protected Endpoint requires :-</text>
  <rect x="70" y="106" width="700" height="30" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="88" y="126" font-size="14" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">Header:   Authorization: Bearer {token}</text>

  <!-- Error cases -->
  <rect x="50" y="164" width="470" height="150" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.3"/>
  <text x="285" y="188" font-size="15" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Error Cases :-</text>
  <line x1="70" y1="196" x2="500" y2="196" stroke="#f38ba8" stroke-width="0.7"/>

  <rect x="70" y="208" width="420" height="34" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="90" y="230" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">401</text>
  <text x="140" y="230" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">→  Token missing or invalid</text>

  <rect x="70" y="250" width="420" height="34" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="90" y="272" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">401</text>
  <text x="140" y="272" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">→  Token expired  ( Frontend should call POST /auth/refresh )</text>

  <rect x="70" y="292" width="420" height="34" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="90" y="314" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">429</text>
  <text x="140" y="314" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">→  Rate limit hit  ( response includes retry_after )</text>

  <!-- Token lifecycle -->
  <rect x="580" y="164" width="470" height="150" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="815" y="188" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Token Lifecycle :-</text>
  <line x1="600" y1="196" x2="1030" y2="196" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="600" y="222" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Token returned on:  register  +  login  +  refresh</text>
  <text x="600" y="248" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">expires_in:  3600  ( 1 hour )</text>
  <text x="600" y="272" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">On 401 expired  →  POST /api/auth/refresh</text>
  <text x="600" y="296" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">If refresh fails  →  Logout + Redirect to Login</text>

  <line x1="60" y1="330" x2="1040" y2="330" stroke="#313244" stroke-width="0.7"/>
  <text x="550" y="346" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts  —  Authentication</text>
</svg>
