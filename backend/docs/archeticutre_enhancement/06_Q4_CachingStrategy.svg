<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="840" viewBox="0 0 1300 840">
  <rect width="1300" height="840" fill="#1e1e2e"/>
  <text x="650" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Q4 :- Which Caching Strategy?</text>
  <line x1="60" y1="55" x2="1240" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="650" y="74" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Decision:  Hybrid  ( Cache + DB )  —  best of both worlds</text>

  <!-- Option 1 -->
  <rect x="50" y="88" width="350" height="280" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <text x="225" y="112" font-size="14" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Option 1 — Laravel Cache only</text>
  <line x1="70" y1="120" x2="380" y2="120" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="70" y="148" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Fast — returns immediately</text>
  <text x="70" y="170" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Easy to configure</text>
  <text x="70" y="192" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  Cache Clear = all data lost</text>
  <text x="70" y="214" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  Not persistent across deploys</text>
  <rect x="70" y="330" width="280" height="26" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="0.8"/>
  <text x="210" y="347" font-size="12" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Partial — loses data on restart</text>

  <!-- Option 2 -->
  <rect x="460" y="88" width="350" height="280" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="635" y="112" font-size="14" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Option 2 — DB Mapping Table only</text>
  <line x1="480" y1="120" x2="790" y2="120" stroke="#f9e2af" stroke-width="0.7"/>
  <text x="480" y="148" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Persistent — survives restarts</text>
  <text x="480" y="170" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Can match without TMDB call</text>
  <text x="480" y="192" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  Extra DB query on every hit</text>
  <text x="480" y="214" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  Slower than in-memory cache</text>
  <rect x="480" y="330" width="280" height="26" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="620" y="347" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Slower — extra query every time</text>

  <!-- Option 3: Hybrid -->
  <rect x="870" y="88" width="380" height="280" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="1060" y="112" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Option 3 — Hybrid  ( Chosen )</text>
  <line x1="890" y1="120" x2="1230" y2="120" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="890" y="148" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Cache speed for reads</text>
  <text x="890" y="170" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">✅  DB persistence for reliability</text>
  <text x="890" y="198" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Flow:</text>
  <text x="910" y="218" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">1.  Check Cache first</text>
  <text x="910" y="238" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">2.  If miss  →  Check DB</text>
  <text x="910" y="258" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">3.  If miss  →  Call TMDB + save both</text>
  <text x="910" y="278" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Next hit  →  Cache (1ms)</text>
  <rect x="890" y="330" width="340" height="26" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="0.9"/>
  <text x="1060" y="347" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Fast + Persistent</text>

  <!-- DB Table -->
  <rect x="50" y="388" width="1200" height="380" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1.3"/>
  <text x="650" y="412" font-size="15" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">DB Mapping Table :- title_tmdb_mappings</text>
  <line x1="70" y1="420" x2="1230" y2="420" stroke="#89b4fa" stroke-width="0.7"/>

  <!-- Table columns -->
  <rect x="70" y="434" width="500" height="300" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="80" y="456" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Column</text>
  <text x="300" y="456" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Type</text>
  <line x1="80" y1="462" x2="560" y2="462" stroke="#313244" stroke-width="0.5"/>
  <text x="80" y="482" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">id</text>
  <text x="300" y="482" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">integer, primary key</text>
  <text x="80" y="504" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">title_name</text>
  <text x="300" y="504" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">string, indexed</text>
  <text x="80" y="526" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">release_year</text>
  <text x="300" y="526" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">smallint, nullable</text>
  <text x="80" y="548" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">tmdb_id</text>
  <text x="300" y="548" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">integer</text>
  <text x="80" y="570" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">tmdb_type</text>
  <text x="300" y="570" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">enum('movie', 'tv')</text>
  <text x="80" y="592" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster_path</text>
  <text x="300" y="592" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">string, nullable</text>
  <text x="80" y="614" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">backdrop_path</text>
  <text x="300" y="614" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">string, nullable</text>
  <text x="80" y="636" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">created_at</text>
  <text x="300" y="636" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">timestamp</text>
  <text x="80" y="702" font-size="11" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster_path / backdrop_path stored as TMDB image paths</text>
  <text x="80" y="718" font-size="11" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">not full URLs — TMDB base URL added at response time</text>

  <!-- Why paths not URLs -->
  <rect x="620" y="434" width="590" height="300" rx="4" fill="#181825" stroke="#313244" stroke-width="0.8"/>
  <text x="915" y="458" font-size="14" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Why store paths, not full URLs? :-</text>
  <line x1="640" y1="466" x2="1190" y2="466" stroke="#313244" stroke-width="0.5"/>
  <text x="640" y="494" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB image base URL can change</text>
  <text x="640" y="514" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">https://image.tmdb.org/t/p/w500{poster_path}</text>
  <text x="640" y="542" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Store only:  /qrGtVrVl5cFpyk.jpg</text>
  <text x="640" y="562" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Build full URL in response  →  flexible</text>
  <text x="640" y="590" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">Size can be changed without DB migration</text>
  <text x="640" y="610" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">w92, w185, w300, w500, original</text>
  <text x="640" y="638" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">→  Future-proof design</text>

  <line x1="50" y1="786" x2="1250" y2="786" stroke="#313244" stroke-width="0.7"/>
  <text x="650" y="802" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  Q4: Caching Strategy + DB Table</text>
</svg>
