<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <rect width="1200" height="580" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Q3 :- Synchronous or Cache from the start?</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Cache from the start  —  required, not optional</text>

  <!-- Why -->
  <rect x="50" y="88" width="520" height="200" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.3"/>
  <text x="310" y="112" font-size="15" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Why caching is required :-</text>
  <line x1="70" y1="120" x2="560" y2="120" stroke="#f9e2af" stroke-width="0.7"/>
  <text x="70" y="148" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB data does not change every day</text>
  <text x="70" y="170" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">The poster for "Breaking Bad" is the same today and tomorrow</text>
  <text x="70" y="200" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB has a rate limit</text>
  <text x="70" y="222" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Without cache: every user request = 1 TMDB API call</text>
  <text x="70" y="244" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">With cache: 1 TMDB call total  →  rest served locally</text>
  <text x="70" y="268" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Caching is free speed with no tradeoffs here</text>

  <!-- Without cache -->
  <rect x="630" y="88" width="520" height="200" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.3"/>
  <text x="890" y="112" font-size="15" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Without Cache :-</text>
  <line x1="650" y1="120" x2="1140" y2="120" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="650" y="148" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Every User opens Breaking Bad page:</text>
  <text x="670" y="172" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">= 1 HTTP call to TMDB</text>
  <text x="670" y="196" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">= added latency for every request</text>
  <text x="670" y="220" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">= TMDB rate limit hit at scale</text>
  <rect x="650" y="244" width="470" height="30" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="0.8"/>
  <text x="885" y="264" font-size="13" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">100 users × 10 calls = 1000 TMDB calls</text>

  <!-- Flow comparison -->
  <rect x="50" y="308" width="1100" height="186" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="600" y="332" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">With Cache :-</text>
  <line x1="70" y1="340" x2="1130" y2="340" stroke="#a6e3a1" stroke-width="0.7"/>

  <!-- Row 1 -->
  <text x="80" y="368" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">First request:</text>
  <line x1="200" y1="360" x2="320" y2="360" stroke="#f9e2af" stroke-width="1.0"/>
  <polygon points="320,360 310,354 310,366" fill="#f9e2af"/>
  <text x="250" y="355" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">call</text>
  <rect x="330" y="346" width="100" height="28" rx="3" fill="#181825" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="380" y="364" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB API</text>
  <line x1="430" y1="360" x2="540" y2="360" stroke="#a6e3a1" stroke-width="1.0"/>
  <polygon points="540,360 530,354 530,366" fill="#a6e3a1"/>
  <text x="490" y="355" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">save</text>
  <rect x="550" y="346" width="100" height="28" rx="3" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="600" y="364" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Cache</text>
  <text x="670" y="365" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  ~100ms  +  cache saved</text>

  <!-- Row 2 -->
  <text x="80" y="420" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">All subsequent requests:</text>
  <line x1="310" y1="412" x2="420" y2="412" stroke="#a6e3a1" stroke-width="1.0"/>
  <polygon points="420,412 410,406 410,418" fill="#a6e3a1"/>
  <text x="365" y="407" font-size="11" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">read</text>
  <rect x="430" y="398" width="100" height="28" rx="3" fill="#181825" stroke="#a6e3a1" stroke-width="0.8"/>
  <text x="480" y="416" font-size="12" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Cache</text>
  <text x="550" y="417" font-size="13" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  ~1ms  —  no TMDB call  ✅</text>

  <text x="600" y="468" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">100 users × 10 requests = still just 1 TMDB call per unique title</text>

  <line x1="50" y1="508" x2="1150" y2="508" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="524" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  Q3: Synchronous vs Cache</text>
</svg>
