<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">API Contracts Impact :- What changes for Frontend</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Will change -->
  <rect x="50" y="72" width="1100" height="300" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <text x="600" y="96" font-size="16" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Contracts that change :-</text>
  <line x1="70" y1="104" x2="1130" y2="104" stroke="#a6e3a1" stroke-width="0.7"/>

  <!-- Row 1 -->
  <rect x="70" y="114" width="1060" height="80" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="122" width="260" height="24" rx="3" fill="#cba6f7" fill-opacity="0.25" stroke="#cba6f7" stroke-width="0.9"/>
  <text x="210" y="138" font-size="13" fill="#cba6f7" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /titles/{title}</text>
  <text x="356" y="138" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Full TMDB enrichment</text>
  <text x="80" y="162" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Adds:</text>
  <text x="130" y="162" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster_url,  backdrop_url,  overview,  vote_average,  cast,  trailer_key,  tmdb_available</text>
  <text x="80" y="184" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">tmdb_available: true  →  show rich UI  |  tmdb_available: false  →  show fallback UI  ( no crash )</text>

  <!-- Row 2 -->
  <rect x="70" y="202" width="1060" height="68" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="210" width="300" height="24" rx="3" fill="#89b4fa" fill-opacity="0.25" stroke="#89b4fa" stroke-width="0.9"/>
  <text x="230" y="226" font-size="13" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /recommendations/{title}</text>
  <text x="396" y="226" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster per result</text>
  <text x="80" y="250" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Adds:</text>
  <text x="130" y="250" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster_url  per result item  ( null if TMDB unavailable )</text>
  <text x="80" y="268" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Frontend:  show poster if available  →  placeholder image if null</text>

  <!-- Row 3 -->
  <rect x="70" y="278" width="1060" height="80" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="286" width="180" height="24" rx="3" fill="#f9e2af" fill-opacity="0.25" stroke="#f9e2af" stroke-width="0.9"/>
  <text x="170" y="302" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /home</text>
  <text x="276" y="302" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster per section item</text>
  <text x="80" y="326" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Adds:</text>
  <text x="130" y="326" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster_url  per item in every section  ( null if TMDB unavailable )</text>
  <text x="80" y="344" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Each section item:  { title, type, release_year, similarity_score, user_signals, poster_url }</text>

  <!-- Will NOT change -->
  <rect x="50" y="390" width="1100" height="120" rx="6" fill="#11111b" stroke="#6c7086" stroke-width="1.2"/>
  <text x="600" y="414" font-size="15" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Contracts that do NOT change :-</text>
  <line x1="70" y1="422" x2="1130" y2="422" stroke="#6c7086" stroke-width="0.6"/>

  <rect x="70" y="432" width="490" height="34" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <text x="80" y="453" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Auth, Favorites, History, Search</text>
  <text x="310" y="453" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  completely unchanged</text>

  <rect x="590" y="432" width="550" height="34" rx="4" fill="#181825" stroke="#fab387" stroke-width="0.7"/>
  <text x="600" y="453" font-size="13" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">GET /favorites  +  GET /history</text>
  <text x="840" y="453" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">★  poster_url optional — can add later</text>

  <text x="600" y="494" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Search stays lean  —  no poster in autocomplete dropdown  ( latency is priority )</text>

  <line x1="50" y1="520" x2="1150" y2="520" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="536" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  API Contracts Impact</text>
</svg>
