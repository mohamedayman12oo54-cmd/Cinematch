<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Final Decisions :- TMDB Integration Summary</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="600" y="74" font-size="14" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">All decisions locked — ready for implementation</text>

  <!-- Decisions list -->
  <rect x="50" y="88" width="1100" height="386" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <text x="600" y="112" font-size="15" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  All decisions :-</text>
  <line x1="70" y1="120" x2="1130" y2="120" stroke="#a6e3a1" stroke-width="0.7"/>

  <!-- Decision rows -->
  <rect x="70" y="132" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="140" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="155" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="149" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">TmdbService  ( not Interface — YAGNI )</text>
  <text x="560" y="149" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Direct class, no abstraction layer until a second source is needed</text>

  <rect x="70" y="182" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="190" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="205" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="199" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Hybrid Caching  ( Cache + DB Table )</text>
  <text x="560" y="199" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Cache for speed  +  DB for persistence  —  title_tmdb_mappings table</text>

  <rect x="70" y="232" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="240" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="255" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="249" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Parallel Calls for ML + TMDB</text>
  <text x="560" y="249" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Both fired simultaneously — not sequential  ( max time, not sum time )</text>

  <rect x="70" y="282" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="290" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="305" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="299" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Graceful Degradation for all TMDB calls</text>
  <text x="560" y="299" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">If TMDB fails  →  return ML data only  —  app never crashes</text>

  <rect x="70" y="332" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="340" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="355" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="349" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">poster_url only for Recommendations + Home</text>
  <text x="560" y="349" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Full TMDB data only on Title Details  —  recommendations get poster only</text>

  <rect x="70" y="382" width="1060" height="42" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="390" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="405" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="399" font-size="14" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">Full TMDB data for Title Details page</text>
  <text x="560" y="399" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster, backdrop, overview, vote_average, cast, trailer_key — all merged</text>

  <rect x="70" y="432" width="1060" height="36" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <rect x="80" y="440" width="22" height="22" rx="3" fill="#a6e3a1"/>
  <text x="91" y="455" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅</text>
  <text x="116" y="453" font-size="13" fill="#f9e2af" font-family="Excalifont, 'Comic Sans MS', cursive">tmdb_available flag for Frontend  +  Match Strategy: title + year + type  ( ±1 year tolerance )</text>

  <!-- Footer note -->
  <rect x="50" y="492" width="1100" height="36" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.0"/>
  <text x="600" y="514" font-size="13" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">All decisions follow:  Graceful Degradation  +  Single Responsibility  +  YAGNI  +  Industry Standard</text>

  <line x1="50" y1="542" x2="1150" y2="542" stroke="#313244" stroke-width="0.7"/>
</svg>
