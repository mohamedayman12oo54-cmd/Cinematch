<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#1e1e2e"/>
  <text x="550" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration :- Understanding the Problem</text>
  <line x1="60" y1="55" x2="1040" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- What ML returns -->
  <rect x="50" y="72" width="470" height="330" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.3"/>
  <text x="285" y="96" font-size="16" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  What ML Model returns :-</text>
  <line x1="70" y1="104" x2="500" y2="104" stroke="#a6e3a1" stroke-width="0.7"/>
  <text x="80" y="130" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">ML Model returns :-</text>
  <text x="100" y="156" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  title</text>
  <text x="100" y="178" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  type</text>
  <text x="100" y="200" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  director</text>
  <text x="100" y="222" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  country</text>
  <text x="100" y="244" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  release_year</text>
  <text x="100" y="266" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  rating</text>
  <text x="100" y="288" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">├─  genres</text>
  <text x="100" y="310" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">└─  similarity_score</text>
  <text x="80" y="348" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">These are all text fields — no visual data</text>
  <text x="80" y="370" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Good enough for rankings but poor UX</text>

  <!-- What is missing -->
  <rect x="580" y="72" width="470" height="330" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.3"/>
  <text x="815" y="96" font-size="16" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✗  What is missing :-</text>
  <line x1="600" y1="104" x2="1030" y2="104" stroke="#f38ba8" stroke-width="0.7"/>
  <text x="610" y="130" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Fields ML cannot provide :-</text>
  <text x="630" y="156" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  poster</text>
  <text x="810" y="156" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  main visual for the card</text>
  <text x="630" y="182" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  backdrop</text>
  <text x="810" y="182" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  hero background image</text>
  <text x="630" y="208" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  overview / description</text>
  <text x="810" y="208" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  plot summary</text>
  <text x="630" y="234" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  cast</text>
  <text x="810" y="234" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  top 5 actors</text>
  <text x="630" y="260" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  trailer</text>
  <text x="810" y="260" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  YouTube key</text>
  <text x="630" y="286" font-size="13" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">✗  vote_average</text>
  <text x="810" y="286" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">→  user rating score</text>

  <!-- Result -->
  <rect x="580" y="316" width="470" height="76" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="1.0"/>
  <text x="815" y="342" font-size="14" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Result :-</text>
  <text x="600" y="366" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Title detail page is visually poor</text>
  <text x="600" y="384" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Cannot compete with any modern streaming site</text>

  <!-- Result box bottom -->
  <rect x="50" y="420" width="1000" height="80" rx="6" fill="#181825" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="550" y="446" font-size="15" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">The Problem in One Line :-</text>
  <text x="550" y="472" font-size="14" fill="#cdd6f4" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">ML Model is great at recommendations but has no images, posters, or rich metadata</text>
  <text x="550" y="492" font-size="13" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Solution:  enrich ML results with TMDB data as a second source</text>

  <line x1="50" y1="518" x2="1050" y2="518" stroke="#313244" stroke-width="0.7"/>
  <text x="550" y="534" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  The Problem</text>
</svg>
