<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680">
  <rect width="1300" height="680" fill="#1e1e2e"/>
  <text x="650" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Endpoints Review :- TMDB Impact per Endpoint</text>
  <line x1="60" y1="55" x2="1240" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Will change -->
  <rect x="50" y="72" width="1200" height="296" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <text x="650" y="96" font-size="16" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Endpoints that will change :-</text>
  <line x1="70" y1="104" x2="1230" y2="104" stroke="#a6e3a1" stroke-width="0.7"/>

  <!-- Row 1 -->
  <rect x="70" y="114" width="1160" height="78" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="122" width="260" height="24" rx="3" fill="#cba6f7" fill-opacity="0.2" stroke="#cba6f7" stroke-width="0.8"/>
  <text x="210" y="138" font-size="13" fill="#cba6f7" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/titles/{title}</text>
  <text x="80" y="170" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Previously:  only ML data returned</text>
  <text x="80" y="186" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Now:  ML data + TMDB merged  ( poster, backdrop, overview, cast, trailer, vote_average )</text>
  <text x="900" y="138" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Full TMDB enrichment</text>

  <!-- Row 2 -->
  <rect x="70" y="200" width="1160" height="78" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="208" width="300" height="24" rx="3" fill="#89b4fa" fill-opacity="0.2" stroke="#89b4fa" stroke-width="0.8"/>
  <text x="230" y="224" font-size="13" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/recommendations/{title}</text>
  <text x="80" y="256" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Previously:  title + similarity_score only</text>
  <text x="80" y="272" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Now:  each result needs  poster_url  —  10 parallel TMDB calls with Caching</text>
  <text x="900" y="224" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster per result</text>

  <!-- Row 3 -->
  <rect x="70" y="286" width="1160" height="68" rx="4" fill="#181825" stroke="#313244" stroke-width="0.7"/>
  <rect x="80" y="294" width="160" height="24" rx="3" fill="#f9e2af" fill-opacity="0.2" stroke="#f9e2af" stroke-width="0.8"/>
  <text x="160" y="310" font-size="13" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home</text>
  <text x="80" y="338" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Previously:  title + type only per item</text>
  <text x="80" y="354" font-size="12" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">→  Now:  each item in every section needs  poster_url</text>
  <text x="900" y="310" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster per section item</text>

  <!-- Will NOT change -->
  <rect x="50" y="386" width="1200" height="196" rx="6" fill="#11111b" stroke="#6c7086" stroke-width="1.2"/>
  <text x="650" y="410" font-size="16" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Endpoints that will NOT change :-</text>
  <line x1="70" y1="418" x2="1230" y2="418" stroke="#6c7086" stroke-width="0.7"/>

  <rect x="70" y="428" width="1160" height="40" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <text x="80" y="448" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/search</text>
  <text x="300" y="448" font-size="12" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">→  not changed</text>
  <text x="500" y="448" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">User types quickly — poster not needed in dropdown  —  latency is priority</text>

  <rect x="70" y="476" width="1160" height="40" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <text x="80" y="496" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">POST /api/favorites  +  POST /api/history</text>
  <text x="470" y="496" font-size="12" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">→  not changed</text>
  <text x="570" y="496" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">store title_name — no display needed at write time</text>

  <rect x="70" y="524" width="1160" height="40" rx="4" fill="#181825" stroke="#313244" stroke-width="0.6"/>
  <text x="80" y="544" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/favorites  +  GET /api/history</text>
  <text x="450" y="544" font-size="12" fill="#fab387" font-family="Excalifont, 'Comic Sans MS', cursive">★  optional poster</text>
  <text x="600" y="544" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">could add poster later — not required for MVP</text>

  <line x1="50" y1="598" x2="1250" y2="598" stroke="#313244" stroke-width="0.7"/>
  <text x="650" y="614" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  Endpoints Review</text>
</svg>
