<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#1e1e2e"/>
  <text x="600" y="44" font-size="26" fill="#89b4fa" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Q7 :- When does TMDB enrichment actually happen?</text>
  <line x1="60" y1="55" x2="1140" y2="55" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Cards -->
  <rect x="50" y="72" width="260" height="220" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <rect x="64" y="80" width="100" height="22" rx="3" fill="#a6e3a1"/>
  <text x="114" y="95" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Required</text>
  <text x="180" y="120" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Title Details Page</text>
  <line x1="68" y1="128" x2="296" y2="128" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="68" y="152" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/titles/{title}</text>
  <text x="68" y="174" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">User wants full details</text>
  <text x="68" y="196" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Every user needs:</text>
  <text x="68" y="216" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster + overview + cast</text>
  <text x="68" y="236" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">trailer + vote_average</text>
  <text x="68" y="276" font-size="11" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Priority 1 — always enrich</text>

  <rect x="340" y="72" width="260" height="220" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <rect x="354" y="80" width="100" height="22" rx="3" fill="#a6e3a1"/>
  <text x="404" y="95" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Required</text>
  <text x="470" y="120" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Recommendations</text>
  <line x1="358" y1="128" x2="586" y2="128" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="358" y="152" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/recommendations/{title}</text>
  <text x="358" y="174" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">10 results need poster each</text>
  <text x="358" y="196" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster per result needed</text>
  <text x="358" y="220" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">no poster = blank cards</text>
  <text x="358" y="244" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">10 parallel TMDB calls</text>
  <text x="358" y="276" font-size="11" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Priority 1 — always enrich</text>

  <rect x="630" y="72" width="260" height="220" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.3"/>
  <rect x="644" y="80" width="100" height="22" rx="3" fill="#f38ba8"/>
  <text x="694" y="95" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✗  Not needed</text>
  <text x="760" y="120" font-size="14" fill="#f38ba8" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Search Autocomplete</text>
  <line x1="648" y1="128" x2="876" y2="128" stroke="#f38ba8" stroke-width="0.6"/>
  <text x="648" y="152" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/search?q=</text>
  <text x="648" y="174" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">User types quickly</text>
  <text x="648" y="196" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">poster not shown in dropdown</text>
  <text x="648" y="218" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">latency is critical here</text>
  <text x="648" y="240" font-size="12" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">adding TMDB = extra delay</text>
  <text x="648" y="276" font-size="11" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">Skip — title only is enough</text>

  <rect x="920" y="72" width="230" height="220" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.4"/>
  <rect x="934" y="80" width="100" height="22" rx="3" fill="#a6e3a1"/>
  <text x="984" y="95" font-size="11" fill="#1e1e2e" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">✅  Required</text>
  <text x="1035" y="120" font-size="14" fill="#a6e3a1" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Home Page Items</text>
  <line x1="938" y1="128" x2="1136" y2="128" stroke="#a6e3a1" stroke-width="0.6"/>
  <text x="938" y="152" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">GET /api/home</text>
  <text x="938" y="174" font-size="12" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">poster per section item</text>
  <text x="938" y="196" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Home looks empty</text>
  <text x="938" y="218" font-size="12" fill="#f38ba8" font-family="Excalifont, 'Comic Sans MS', cursive">without posters</text>
  <text x="938" y="240" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">less critical than</text>
  <text x="938" y="258" font-size="12" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">Recommendations</text>
  <text x="938" y="278" font-size="11" fill="#a6e3a1" font-family="Excalifont, 'Comic Sans MS', cursive">Enrich — poster minimum</text>

  <!-- Decision rule -->
  <rect x="50" y="318" width="1100" height="120" rx="6" fill="#11111b" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="600" y="342" font-size="15" fill="#f9e2af" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">Decision Rule :-</text>
  <line x1="70" y1="350" x2="1130" y2="350" stroke="#f9e2af" stroke-width="0.7"/>
  <text x="80" y="378" font-size="13" fill="#cdd6f4" font-family="Excalifont, 'Comic Sans MS', cursive">If poster is needed  →  enrich with TMDB  ( use Cache to avoid extra latency )</text>
  <text x="80" y="402" font-size="13" fill="#6c7086" font-family="Excalifont, 'Comic Sans MS', cursive">If poster is not needed  →  skip TMDB  ( Search autocomplete drops stay lean )</text>
  <text x="80" y="426" font-size="13" fill="#94e2d5" font-family="Excalifont, 'Comic Sans MS', cursive">→  Cache makes enrichment practically free — no performance penalty after first call</text>

  <line x1="50" y1="456" x2="1150" y2="456" stroke="#313244" stroke-width="0.7"/>
  <text x="600" y="472" font-size="12" fill="#6c7086" text-anchor="middle" font-family="Excalifont, 'Comic Sans MS', cursive">TMDB Integration  —  Q7: When to enrich?</text>
</svg>
